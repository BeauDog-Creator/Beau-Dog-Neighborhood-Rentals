 x=allListings().find(y=>y.id===id);if(!x)return;let o=ownerFor(x),mine=x.ownerId==='me',f=favorites();main.innerHTML='<div class="wrap"><button class="back" id="backBrowse">‹ Back to browse</button><div class="picwrap"><div class="detail-pic">'+x.e+'</div><button class="fav" data-fav="'+x.id+'">'+(f.includes(x.id)?'♥':'♡')+'</button></div><div class="detail-title">'+esc(x.n)+'</div><div class="muted">'+(mine?'Your listing':x.d+' miles away')+' • '+esc(x.c)+'</div><div class="rating">⭐ '+o.rating+' '+(o.reviews?'('+o.reviews+' reviews)':'')+' <span class="availability">'+esc(x.a)+'</span></div><div class="detail-grid"><div class="stat"><b>$'+x.p+'</b>per day</div><div class="stat"><b>$'+x.w+'</b>per week</div><div class="stat"><b>$'+x.deposit+'</b>security deposit</div><div class="stat"><b>'+esc(x.delivery)+'</b>handoff</div></div><div class="section-title">About this equipment</div><div class="muted" style="font-size:13px">'+esc(x.desc)+'</div><div class="section-title">Owner</div><div class="owner-card"><div class="avatar">👤</div><div><b>'+esc(o.name)+'</b><div class="muted">⭐ '+o.rating+' rating'+(o.reviews?' • '+o.reviews+' reviews':'')+'</div><span class="badge">'+(mine?'Your profile':'Verified owner')+'</span></div></div>'+(x.included.length?'<div class="section-title">Included with rental</div>'+x.included.map(v=>'<div class="check">✅ '+esc(v)+'</div>').join(''):'')+(x.rules.length?'<div class="section-title">Rental rules</div>'+x.rules.map(v=>'<div class="check">• '+esc(v)+'</div>').join(''):'')+'<div class="privacy"><b>Address privacy:</b> Exact pickup addresses stay hidden until the rental is confirmed.</div><div class="sticky-request">'+(mine?'<button class="btn primary full" id="editHere">Edit Your Listing</button>':'<button class="btn primary full" id="detailRent">Request Rental • $'+x.p+'/day</button>')+'</div></div>';document.getElementById('backBrowse').onclick=home;document.querySelector('[data-fav]').onclick=()=>{let fs=favorites();fs=fs.includes(id)?fs.filter(v=>v!==id):[...fs,id];set('favorites',fs);detail(id)};if(mine)document.getElementById('editHere').onclick=()=>editListing(id);else document.getElementById('detailRent').onclick=()=>requestForm(id);scrollTo(0,0)}function ownerProfile(ownerId){let o=owners[ownerId];if(!o)return;let items=demo.filter(x=>x.ownerId===ownerId);main.innerHTML='<div class="wrap"><button class="back" id="backBrowse">‹ Back</button><div class="panel"><div class="profile-head"><div class="avatar">👤</div><h2>'+esc(o.name)+'</h2><span class="badge">✓ Verified owner</span><div class="muted" style="margin-top:8px">'+esc(o.member)+'</div></div><div class="profile-stats"><div><b>'+o.rating+'</b>Rating</div><div><b>'+o.rentals+'</b>Rentals</div><div><b>'+o.reviews+'</b>Reviews</div></div><div class="section-title">About</div><div class="muted" style="font-size:13px">'+esc(o.bio)+'</div><div class="section-title">Response time</div><div class="muted">'+esc(o.response)+'</div><div class="section-title">Equipment from '+esc(o.name)+'</div>'+items.map(x=>'<div class="mylisting"><div class="row"><b>'+esc(x.n)+'</b><span class="price">$'+x.p+'/day</span></div><div class="muted">'+esc(x.c)+' • '+x.d+' miles away</div><button class="btn secondary full" data-detail="'+x.id+'" style="margin-top:9px">View Equipment</button></div>').join('')+'</div></div>';document.getElementById('backBrowse').onclick=home;document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail))}function requestForm(id){let x=allListings().find(y=>y.id===id);if(!x||x.ownerId==='me')return;let o=ownerFor(x);main.innerHTML='<div class="wrap"><button class="back" id="backDetail">‹ Back</button><div class="panel"><h2>Request '+esc(x.n)+'</h2><div class="muted">Owner: '+esc(o.name)+' • '+x.d+' miles away</div><label>Start date</label><input id="start" type="date"><label>Number of days</label><select id="days"><option value="1">1 day</option><option value="2">2 days</option><option value="3">3 days</option><option value="4">4 days</option><option value="7">7 days</option></select><label>Pickup / delivery</label><select id="handoff"><option>'+esc(x.delivery)+'</option></select><label>Message to owner</label><textarea id="msg" placeholder="Tell the owner what you’re using it for or ask a question."></textarea><div id="cost" class="summary-box"></div><div class="privacy">The owner must approve the request before pickup details are shown.</div><button class="btn primary full" id="sendRequest" style="margin-top:14px">Send Rental Request</button></div></div>';function cost(){let days=+document.getElementById('days').value,rental=days>=7?x.w:x.p*days;document.getElementById('cost').innerHTML='<div class="summary-row"><span>Rental</span><b>$'+rental+'</b></div><div class="summary-row"><span>Security deposit</span><b>$'+x.deposit+'</b></div><div class="summary-row total"><span>Authorization total</span><span>$'+(rental+x.deposit)+'</span></div>'}cost();document.getElementById('days').onchange=cost;document.getElementById('backDetail').onclick=()=>detail(id);document.getElementById('sendRequest').onclick=()=>{let start=document.getElementById('start').value;if(!start)return alert('Choose a start date.');let days=+document.getElementById('days').value,a=rentals(),rid='r'+Date.now();a.unshift({id:rid,itemId:x.id,name:x.n,status:'Pending owner approval',start,days,owner:o.name,ownerId:x.ownerId,message:document.getElementById('msg').value});set('rentals',a);let m=messages();m[rid]=[{from:'me',text:document.getElementById('msg').value||'Hi, I would like to rent this equipment.',time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}];set('messages',m);alert('Rental request sent to '+o.name+'.');show('rentals')}}function need(){let a=needs();main.innerHTML='<div class="wrap"><div class="panel"><h2>I Need This</h2><label>What do you need?</label><input id="ni"><label>Budget per day</label><input id="nb" type="number"><button id="post" class="btn primary full" style="margin-top:14px">Post Request</button></div><div class="panel" style="margin-top:14px">'+(a.length?a.map((x,i)=>'<div class="item"><div class="row"><b>'+esc(x.item)+'</b><span class="badge">Active</span></div><div class="muted">Budget $'+x.budget+'/day</div><button class="btn danger" data-dn="'+i+'" style="margin-top:8px">Remove</button></div>').join(''):'<div class="empty">No requests yet.</div>')+'</div></div>';document.getElementById('post').onclick=()=>{let item=document.getElementById('ni').value.trim();if(!item)return alert('Enter what you need.');let x=needs();x.unshift({item,budget:+document.getElementById('nb').value||0});set('needs',x);need()};document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{let x=needs();x.splice(+b.dataset.dn,1);set('needs',x);need()})}function listForm(index=null){let a=listings(),x=index===null?{}:a[index]||{};main.innerHTML='<div class="wrap"><div class="panel"><h2>'+(index===null?'List Equipment':'Edit Listing')+'</h2><label>Equipment name</label><input id="ln" value="'+esc(x.name||'')+'"><label>Category</label><select id="lc">'+['Tools','Lawn & Garden','Farm','Trailers','Construction','Automotive','Snow Equipment','Camping','Party/Event'].map(v=>'<option '+(x.category===v?'selected':'')+'>'+v+'</option>').join('')+'</select><div class="formgrid"><div><label>Daily price</label><input id="lp" type="number" value="'+(x.price||'')+'"></div><div><label>Weekly price</label><input id="lw" type="number" value="'+(x.weekly||'')+'"></div></div><div class="formgrid"><div><label>Security deposit</label><input id="ld" type="number" value="'+(x.deposit||'')+'"></div><div><label>Listing icon</label><select id="le"><option>🧰</option><option>🪵</option><option>🚚</option><option>⚡</option><option>🌱</option><option>💦</option><option>🔧</option><option>🚜</option></select></div></div><label>Description</label><textarea id="lDesc" placeholder="Condition, power, size, best uses...">'+esc(x.description||'')+'</textarea><label>Pickup / delivery</label><select id="lDelivery"><option '+(x.delivery==='Pickup only'?'selected':'')+'>Pickup only</option><option '+(x.delivery==='Pickup or local delivery'?'selected':'')+'>Pickup or local delivery</option><option '+(x.delivery==='Delivery available'?'selected':'')+'>Delivery available</option></select><label>Availability</label><input id="lAvail" placeholder="Example: Available weekends" value="'+esc(x.availability||'Available')+'"><label>Included items <span class="muted">(comma separated)</span></label><input id="lIncluded" value="'+esc(x.included||'')+'" placeholder="Hose, safety glasses, manual"><label>Rental rules <span class="muted">(comma separated)</span></label><input id="lRules" value="'+esc(x.rules||'')+'" placeholder="Return full of fuel, 21+ only"><div class="privacy"><b>Coming next:</b> actual equipment photo uploads. For now listings use a clean equipment icon.</div><button id="saveListing" class="btn primary full" style="margin-top:14px">'+(index===null?'Publish Listing':'Save Changes')+'</button>'+(index!==null?'<button id="cancelEdit" class="btn secondary full" style="margin-top:8px">Cancel</button>':'')+'</div></div>';if(x.emoji)document.getElementById('le').value=x.emoji;document.getElementById('saveListing').onclick=()=>{let name=document.getElementById('ln').value.trim();if(!name)return alert('Enter equipment name.');let obj={name,category:document.getElementById('lc').value,price:+document.getElementById('lp').value||0,weekly:+document.getElementById('lw').value||0,deposit:+document.getElementById('ld').value||0,emoji:document.getElementById('le').value,description:document.getElementById('lDesc').value.trim(),delivery:document.getElementById('lDelivery').value,availability:document.getElementById('lAvail').value.trim()||'Available',included:document.getElementById('lIncluded').value.trim(),rules:document.getElementById('lRules').value.trim()};let arr=listings();if(index===null)arr.unshift(obj);else arr[index]=obj;set('listings',arr);alert(index===null?'Listing published.':'Listing updated.');show('list')};if(index!==null)document.getElementById('cancelEdit').onclick=()=>show('list')}function editListing(id){let i=+id.slice(1);listForm(i)}function listView(){let a=listings();main.innerHTML='<div class="wrap"><div class="panel"><h2>Your Equipment</h2><div class="muted">Create polished listings that renters can browse just like the demo equipment.</div><button id="newListing" class="btn primary full" style="margin-top:12px">+ Add Equipment</button></div><div class="panel" style="margin-top:14px">'+(a.length?a.map((x,i)=>'<div class="mylisting"><div class="row"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.category||'Tools')+' • '+esc(x.availability||'Available')+'</div></div><span class="price">$'+(+x.price||0)+'/day</span></div><div class="actions"><button class="btn secondary" data-view="m'+i+'">View</button><button class="btn secondary" data-edit="m'+i+'">Edit</button><button class="btn danger" data-del="'+i+'">Remove</button></div></div>').join(''):'<div class="empty">No equipment listed yet.</div>')+'</div></div>';document.getElementById('newListing').onclick=()=>listForm();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>detail(b.dataset.view));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editListing(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Remove this listing?')){let x=listings();x.splice(+b.dataset.del,1);set('listings',x);listView()}})}function rentalsView(){let a=rentals(),m=messages();main.innerHTML='<div class="wrap"><div class="panel"><h2>My Rentals</h2>'+(a.length?a.map((x,i)=>{let th=m[x.id]||[],last=th[th.length-1];return'<div class="item"><div class="row"><b>'+esc(x.name)+'</b><span class="badge">'+esc(x.status)+'</span></div><div class="muted">'+(x.start?'Starts '+esc(x.start)+' • '+x.days+' day'+(x.days>1?'s':''):'')+(x.owner?' • Owner: '+esc(x.owner):'')+'</div>'+(last?'<div class="msg-preview">💬 '+esc(last.text)+'</div>':'')+'<div class="privacy">Exact addresses remain hidden until a rental is confirmed.</div><div class="actions"><button class="btn secondary" data-chat="'+i+'">Message</button><button class="btn danger" data-cr="'+i+'">Cancel</button></div></div>'}).join(''):'<div class="empty">No rental requests yet.</div>')+'</div></div>';document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>chatView(+b.dataset.chat));document.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>{let x=rentals();x.splice(+b.dataset.cr,1);set('rentals',x);rentalsView()})}function chatView(index){let r=rentals()[index];if(!r)return;let m=messages(),thread=m[r.id]||[];main.innerHTML='<div class="wrap"><button class="back" id="backRentals">‹ Back to rentals</button><div class="panel"><h2>'+esc(r.owner||'Owner')+'</h2><div class="muted">About '+esc(r.name)+'</div><div class="privacy">Keep pickup details in the app. Exact addresses remain private until confirmation.</div><div style="margin-top:14px">'+thread.map(x=>'<div class="bubble '+(x.from==='me'?'mine':'theirs')+'">'+esc(x.text)+'<div style="font-size:10px;opacity:.7;margin-top:3px">'+esc(x.time||'')+'</div></div>').join('')+'</div><div class="chatbox"><input id="chatInput" placeholder="Write a message..."><button class="btn primary" id="sendMsg">Send</button></div></div></div>';document.getElementById('backRentals').onclick=rentalsView;document.getElementById('sendMsg').onclick=()=>{let t=document.getElementById('chatInput').value.trim();if(!t)return;let mm=messages();mm[r.id]=mm[r.id]||[];mm[r.id].push({from:'me',text:t,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});set('messages',mm);chatView(index)}}function profileView(){let p=profile(),f=favorites().length;main.innerHTML='<div class="wrap"><div class="panel"><div class="profile-head"><div class="avatar">👤</div><h2>'+esc(p.name)+'</h2><span class="badge">Member profile</span></div><div class="profile-stats"><div><b>'+listings().length+'</b>Listings</div><div><b>'+rentals().length+'</b>Rentals</div><div><b>'+f+'</b>Favorites</div></div><div class="item"><b>How you use Beau Dog</b><div class="muted">'+esc(p.role||'')+'</div></div><div class="item"><b>Address</b><div class="muted">'+esc(p.address||'Not entered')+'</div><span class="badge">Private until confirmed rental</span></div><div class="item"><b>Contact</b><div class="muted">'+esc(p.phone||'')+' • '+esc(p.email||'')+'</div></div><div class="item"><b>Search radius</b><div class="muted">'+(p.radius||25)+' miles</div></div><button id="reset" class="btn danger full" style="margin-top:14px">Reset App Data</button></div></div>';document.getElementById('reset').onclick=()=>{if(confirm('Erase local app data?')){localStorage.clear();location.reload()}}}nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.v));if(profile()){nav.classList.remove('hidden');show('home')}else onboard(1);</script></body></html>
