.9,reviews:14}};const demo=[{id:'1',ownerId:'mike',e:'🪵',n:'27-Ton Log Splitter',c:'Lawn & Garden',p:65,w:260,deposit:200,d:4.2,a:'Available today',delivery:'Pickup only',desc:'Heavy-duty gas log splitter.'},{id:'2',ownerId:'sarah',e:'💦',n:'3200 PSI Pressure Washer',c:'Tools',p:38,w:150,deposit:100,d:2.8,a:'Available this weekend',delivery:'Pickup or delivery +$12',desc:'Gas pressure washer for decks, siding and driveways.'},{id:'3',ownerId:'ben',e:'🚚',n:'6×12 Utility Trailer',c:'Trailers',p:45,w:180,deposit:250,d:6.7,a:'Available tomorrow',delivery:'Pickup only',desc:'Utility trailer for equipment and materials.'},{id:'4',ownerId:'jamie',e:'🌱',n:'Rear-Tine Rototiller',c:'Lawn & Garden',p:52,w:205,deposit:150,d:8.1,a:'Available Friday',delivery:'Pickup or delivery +$15',desc:'Rear-tine tiller for garden preparation.'},{id:'5',ownerId:'chris',e:'⚡',n:'6500W Portable Generator',c:'Tools',p:70,w:280,deposit:300,d:11.4,a:'Available today',delivery:'Pickup only',desc:'Portable generator for outages and job sites.'}];const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const esc=(x='')=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const profile=()=>get('profile',null),listings=()=>get('listings',[]),needs=()=>get('needs',[]),rentals=()=>get('rentals',[]),favorites=()=>get('favorites',[]);let s={role:''},browse={q:'',cat:'All',dist:25,sort:'distance',favoritesOnly:false};function myDisplay(x,i){return{id:'m'+i,ownerId:'me',e:x.emoji||'🧰',n:x.name,c:x.category||'Tools',p:+x.price||0,w:+x.weekly||((+x.price||0)*5),deposit:+x.deposit||0,d:0,a:x.availability||'Available',delivery:x.delivery||'Pickup only',desc:x.description||'Locally owned equipment.'}}function allListings(){return[...demo,...listings().map(myDisplay)]}function ownerFor(x){if(x.ownerId==='me')return{name:(profile()||{}).name||'You',rating:5,reviews:0};return owners[x.ownerId]||{name:'Owner',rating:5,reviews:0}}function onboard(step){let body='';if(step===1)body='<h2>Welcome</h2><label>Full name</label><input id="name">';if(step===2)body='<h2>Your address</h2><label>Home address</label><input id="address"><div class="privacy"><b>Private:</b> hidden until a rental is confirmed.</div>';if(step===3)body='<h2>Contact information</h2><label>Phone</label><input id="phone"><label>Email</label><input id="email" type="email">';if(step===4)body='<h2>How will you use the app?</h2><div class="choice" data-r="rent"><b>I want to rent</b></div><div class="choice" data-r="rentout"><b>I want to rent out</b></div><div class="choice" data-r="both"><b>Both</b></div>';if(step===5)body='<h2>What are you looking for?</h2><textarea id="needsText"></textarea><label>Search radius</label><select id="radius"><option>5</option><option>10</option><option selected>25</option><option>50</option></select>';if(step===6)body='<h2>What do you rent out?</h2><textarea id="offersText"></textarea>';if(step===7)body='<h2>Finish setup</h2><p>✅ Address privacy enabled</p><p>✅ Safety guidance available anytime</p><label class="choice"><input id="terms" type="checkbox" style="width:auto"> I agree to the Rental Terms & Safety Agreement.</label>';main.innerHTML='<div class="wrap"><div class="panel">'+body+'<div class="actions">'+(step>1?'<button class="btn secondary" id="back">Back</button>':'')+'<button class="btn primary" id="next">'+(step===7?'Create Profile':'Continue')+'</button></div></div></div>';document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{s.role=x.dataset.r;document.querySelectorAll('[data-r]').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});if(document.getElementById('back'))document.getElementById('back').onclick=()=>onboard(step-1);document.getElementById('next').onclick=()=>{if(step===1){s.name=document.getElementById('name').value.trim();if(!s.name)return alert('Enter your name.')}if(step===2)s.address=document.getElementById('address').value.trim();if(step===3){s.phone=document.getElementById('phone').value.trim();s.email=document.getElementById('email').value.trim()}if(step===4&&!s.role)return alert('Choose Rent, Rent Out, or Both.');if(step===5){s.needs=document.getElementById('needsText').value.trim();s.radius=+document.getElementById('radius').value}if(step===6)s.offers=document.getElementById('offersText').value.trim();if(step===7){if(!document.getElementById('terms').checked)return alert('Please accept the agreement.');set('profile',{...s});nav.classList.remove('hidden');return show('home')}onboard(step+1)}}function show(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if(v==='home')home();if(v==='need')need();if(v==='list')listView();if(v==='rentals')rentalsView();if(v==='profile')profileView();scrollTo(0,0)}function home(){let p=profile(),all=allListings(),f=favorites(),filtered=all.filter(x=>x.d<=browse.dist&&(!browse.q||x.n.toLowerCase().includes(browse.q.toLowerCase())||x.c.toLowerCase().includes(browse.q.toLowerCase()))&&(!browse.favoritesOnly||f.includes(x.id)));main.innerHTML='<div class="wrap"><div class="panel"><h2>Browse nearby equipment</h2><div class="muted">Hi '+esc(p.name)+'. Find what you need close to home.</div><div class="view-switch"><button class="list-on">☰ List View</button><a class="map-go" href="map.html">🗺️ Map View</a></div><button class="btn warnbtn full" id="safetyHome" style="margin-top:10px">🛡️ Safety & How It Works</button><div class="searchbox" style="margin-top:12px"><input id="search" placeholder="Search equipment..." value="'+esc(browse.q)+'"><button class="btn primary" id="go">Search</button></div><label>Distance</label><div class="filters">'+[5,10,25,50].map(d=>'<button class="filter '+(browse.dist===d?'active':'')+'" data-dist="'+d+'">'+d+' mi</button>').join('')+'<button class="filter '+(browse.favoritesOnly?'active':'')+'" id="favFilter">♥ Favorites</button></div></div>'+filtered.map(x=>{let o=ownerFor(x),mine=x.ownerId==='me';return'<div class="card"><div class="picwrap"><div class="pic">'+x.e+'</div><button class="fav" data-fav="'+x.id+'">'+(f.includes(x.id)?'♥':'♡')+'</button></div><div class="body"><div class="row"><div><div class="listing-title">'+esc(x.n)+'</div><div class="meta">'+(mine?'Your listing':x.d+' miles away')+' • '+esc(x.c)+'</div></div><div class="price">$'+x.p+'/day</div></div><div class="rating">⭐ '+o.rating+' <span class="availability">'+esc(x.a)+'</span></div><div class="two-buttons"><button class="btn secondary" data-detail="'+x.id+'">View Details</button>'+(mine?'<button class="btn primary" data-edit="'+x.id+'">Edit Listing</button>':'<button class="btn primary" data-rent="'+x.id+'">Request Rental</button>')+'</div></div></div>'}).join('')+'</div>';document.getElementById('safetyHome').onclick=safetyCenter;document.getElementById('go').onclick=()=>{browse.q=document.getElementById('search').value.trim();home()};document.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>{browse.dist=+b.dataset.dist;home()});document.getElementById('favFilter').onclick=()=>{browse.favoritesOnly=!browse.favoritesOnly;home()};document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let fs=favorites();fs=fs.includes(b.dataset.fav)?fs.filter(v=>v!==b.dataset.fav):[...fs,b.dataset.fav];set('favorites',fs);home()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-rent]').forEach(b=>b.onclick=()=>requestForm(b.dataset.rent));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editListing(b.dataset.edit))}function detail(id){let x=allListings().find(y=>y.id===id);if(!x)return;let mine=x.ownerId==='me';main.innerHTML='<div class="wrap"><button class="back" id="backBrowse">‹ Back to browse</button><div class="detail-pic">'+x.e+'</div><div class="detail-title">'+esc(x.n)+'</div><div class="muted">'+(mine?'Your listing':x.d+' miles away')+' • '+esc(x.c)+'</div><div class="detail-grid"><div class="stat"><b>$'+x.p+'</b>per day</div><div class="stat"><b>$'+x.w+'</b>per week</div><div class="stat"><b>$'+x.deposit+'</b>deposit</div><div class="stat"><b>'+esc(x.delivery)+'</b>handoff</div></div><div class="section-title">About this equipment</div><div class="muted">'+esc(x.desc)+'</div><div class="privacy"><b>Address privacy:</b> Exact pickup addresses stay hidden until the rental is confirmed.</div><div class="safetybox"><b>Before you meet:</b> Confirm the person and equipment match the listing, meet in daylight when possible, inspect the equipment together, and photograph its condition before handoff.</div><button class="btn warnbtn full" id="safeDetail" style="margin-top:10px">View Full Safety Guide</button><div class="sticky-request">'+(mine?'<button class="btn primary full" id="editHere">Edit Your Listing</button>':'<button class="btn primary full" id="detailRent">Request Rental • $'+x.p+'/day</button>')+'</div></div>';document.getElementById('backBrowse').onclick=home;document.getElementById('safeDetail').onclick=safetyCenter;if(mine)document.getElementById('editHere').onclick=()=>editListing(id);else document.getElementById('detailRent').onclick=()=>requestForm(id)}function requestForm(id){let x=allListings().find(y=>y.id===id);if(!x||x.ownerId==='me')return;main.innerHTML='<div class="wrap"><button class="back" id="backDetail">‹ Back</button><div class="panel"><h2>Request '+esc(x.n)+'</h2><label>Start date</label><input id="start" type="date"><label>Number of days</label><select id="days"><option value="1">1 day</option><option value="2">2 days</option><option value="3">3 days</option><option value="7">7 days</option></select><label>Message to owner</label><textarea id="msg"></textarea><div class="safetybox"><b>Meet Safe:</b> Confirm the person and equipment match the listing, inspect and photograph the item before handoff, keep communication in the app, and do not proceed if anything feels wrong.</div><div class="privacy"><b>Address privacy:</b> The owner must approve the request before exact pickup details are shown.</div><button class="btn primary full" id="sendRequest" style="margin-top:14px">Send Rental Request</button><button class="btn warnbtn full" id="safeReq" style="margin-top:8px">Read Safety Guide</button></div></div>';document.getElementById('backDetail').onclick=()=>detail(id);document.getElementById('safeReq').onclick=safetyCenter;document.getElementById('sendRequest').onclick=()=>{let start=document.getElementById('start').value;if(!start)return alert('Choose a start date.');let a=rentals(),o=ownerFor(x);a.unshift({id:'r'+Date.now(),itemId:x.id,name:x.n,status:'Pending owner approval',start,days:+document.getElementById('days').value,owner:o.name});set('rentals',a);show('rentals')}}function need(){let a=needs();main.innerHTML='<div class="wrap"><div class="panel"><h2>I Need This</h2><label>What do you need?</label><input id="ni"><label>Budget per day</label><input id="nb" type="number"><button id="post" class="btn primary full" style="margin-top:14px">Post Request</button></div><div class="panel" style="margin-top:14px">'+(a.length?a.map((x,i)=>'<div class="item"><b>'+esc(x.item)+'</b><div class="muted">Budget $'+x.budget+'/day</div><button class="btn danger" data-delneed="'+i+'" style="margin-top:8px">Remove</button></div>').join(''):'<div class="empty">No requests yet.</div>')+'</div></div>';document.getElementById('post').onclick=()=>{let item=document.getElementById('ni').value.trim();if(!item)return;let x=needs();x.unshift({item,budget:+document.getElementById('nb').value||0});set('needs',x);need()};document.querySelectorAll('[data-delneed]').forEach(b=>b.onclick=()=>{let x=needs();x.splice(+b.dataset.delneed,1);set('needs',x);need()})}function listForm(index=null){let a=listings(),x=index===null?{}:a[index]||{};main.innerHTML='<div class="wrap"><div class="panel"><h2>'+(index===null?'List Equipment':'Edit Listing')+'</h2><label>Equipment name</label><input id="ln" value="'+esc(x.name||'')+'"><label>Category</label><select id="lc"><option>Tools</option><option>Lawn & Garden</option><option>Farm</option><option>Trailers</option><option>Construction</option><option>Automotive</option><option>Snow Equipment</option></select><label>Daily price</label><input id="lp" type="number" value="'+(x.price||'')+'"><label>Weekly price</label><input id="lw" type="number" value="'+(x.weekly||'')+'"><label>Security deposit</label><input id="ld" type="number" value="'+(x.deposit||'')+'"><label>Description</label><textarea id="lDesc">'+esc(x.description||'')+'</textarea><label>Availability</label><input id="lAvail" value="'+esc(x.availability||'Available')+'"><div class="safetybox"><b>Protect Your Property:</b> Do not provide your exact pickup address until the rental is approved. Remove valuables from view and keep the handoff outdoors whenever possible.</div><button id="saveListing" class="btn primary full" style="margin-top:14px">Save Listing</button><button id="safeOwner" class="btn warnbtn full" style="margin-top:8px">Owner Safety Guide</button></div></div>';document.getElementById('safeOwner').onclick=safetyCenter;document.getElementById('saveListing').onclick=()=>{let name=document.getElementById('ln').value.trim();if(!name)return alert('Enter equipment name.');let obj={...x,name,category:document.getElementById('lc').value,price:+document.getElementById('lp').value||0,weekly:+document.getElementById('lw').value||0,deposit:+document.getElementById('ld').value||0,description:document.getElementById('lDesc').value.trim(),availability:document.getElementById('lAvail').value.trim()||'Available'};let arr=listings();if(index===null)arr.unshift(obj);else arr[index]=obj;set('listings',arr);show('list')}}function editListing(id){listForm(+id.slice(1))}function listView(){let a=listings();main.innerHTML='<div class="wrap"><div class="panel"><h2>Your Equipment</h2><button id="newListing" class="btn primary full">+ Add Equipment</button><button id="safeOwnerTop" class="btn warnbtn full" style="margin-top:8px">🛡️ Owner Safety Tips</button></div><div class="panel" style="margin-top:14px">'+(a.length?a.map((x,i)=>'<div class="mylisting"><div class="row"><b>'+esc(x.name)+'</b><span class="price">$'+(+x.price||0)+'/day</span></div><div class="actions"><button class="btn secondary" data-view="m'+i+'">View</button><button class="btn secondary" data-edit="m'+i+'">Edit</button><button class="btn danger" data-del="'+i+'">Remove</button></div></div>').join(''):'<div class="empty">No equipment listed yet.</div>')+'</div></div>';document.getElementById('newListing').onclick=()=>listForm();document.getElementById('safeOwnerTop').onclick=safetyCenter;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>detail(b.dataset.view));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editListing(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let x=listings();x.splice(+b.dataset.del,1);set('listings',x);listView()})}function rentalsView(){let a=rentals();main.innerHTML='<div class="wrap"><div class="panel"><h2>My Rentals</h2>'+(a.length?a.map((x,i)=>'<div class="item"><div class="row"><b>'+esc(x.name)+'</b><span class="badge">'+esc(x.status)+'</span></div><div class="muted">'+(x.start?'Starts '+esc(x.start)+' • ':'')+(x.owner?'Owner: '+esc(x.owner):'')+'</div><div class="safetybox"><b>Handoff reminder:</b> Meet in daylight when possible, inspect together, photograph condition, verify accessories/fuel, and cancel if anything feels wrong.</div><div class="actions"><button class="btn warnbtn" data-problem="'+i+'">Problem / Report</button><button class="btn danger" data-cr="'+i+'">Cancel</button></div></div>').join(''):'<div class="empty">No rental requests yet.</div>')+'</div></div>';document.querySelectorAll('[data-problem]').forEach(b=>b.onclick=()=>reportCenter(a[+b.dataset.problem]));document.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>{let x=rentals();x.splice(+b.dataset.cr,1);set('rentals',x);rentalsView()})}function safetyCenter(){main.innerHTML='<div class="wrap"><button class="back" id="safeBack">‹ Back</button><div class="panel"><h2>🛡️ Safety & How It Works</h2><div class="muted">Simple steps for a safe, clear rental from request to return.</div><div class="section-title">How Beau Dog Neighbor Rentals Works</div>'+[['1','Browse or post a need','Search listings, use Map View, or post an I Need This request.'],['2','Review the listing','Check price, deposit, availability, owner rating, description and rules.'],['3','Send a rental request','Choose dates and ask the owner any questions.'],['4','Wait for approval','Exact pickup locations stay private until the rental is confirmed.'],['5','Inspect together','Check condition and take before photos at pickup.'],['6','Complete pickup','Confirm accessories, fuel level and existing damage.'],['7','Return on time','Return the item in the agreed condition.'],['8','Complete the rental','After return, both sides can rate the experience.']].map(x=>'<div class="step"><div class="stepnum">'+x[0]+'</div><div><b>'+x[1]+'</b><div class="muted">'+x[2]+'</div></div></div>').join('')+'<div class="section-title">Staying Safe When Meeting</div><ul class="safety-list"><li>Meet in daylight whenever possible.</li><li>Use a public or well-visible location when the equipment can reasonably be transported there.</li><li>For large equipment picked up at a home or property, tell someone where you are going and when you expect to return.</li><li>Keep communication inside the app so there is a record of the agreement.</li><li>Never send money through an unapproved payment method requested in a message.</li><li>Do not reveal your exact home address until the rental is confirmed.</li><li>Check verified status, ratings and rental history.</li><li>If something feels suspicious or unsafe, cancel the meeting.</li><li>Do not enter someone’s home unless absolutely necessary.</li><li>Photograph the equipment before pickup and after return.</li><li>Verify serial numbers, accessories, fuel level and visible damage.</li><li>For trailers and powered equipment, confirm the renter understands safe operation and towing/vehicle requirements.</li><li>Never operate equipment while impaired.</li><li>Keep children and bystanders away during equipment demonstrations.</li><li>Use appropriate PPE such as eye, hearing, hand, foot or head protection when required.</li></ul><div class="safetybox"><b>Meet Safe:</b> Confirm the person and equipment match the listing, inspect and photograph the item before handoff, and do not proceed if anything feels wrong.</div><div class="safetybox"><b>Protect Your Property:</b> Do not provide an exact pickup address until the rental is approved. Remove valuables from view and keep the handoff outdoors whenever possible.</div><div class="section-title">Emergency or Problem During a Rental</div><div class="reportgrid"><button class="btn warnbtn" data-report="Report User">Report User</button><button class="btn warnbtn" data-report="Unsafe Equipment">Unsafe Equipment</button><button class="btn warnbtn" data-report="Damage or Dispute">Damage / Dispute</button><button class="btn danger" data-report="Cancel Rental">Cancel Rental</button></div><div class="dangerbox"><b>Immediate danger:</b> Leave the area and contact local emergency services. Do not use the app as a substitute for emergency help.</div><div class="tiny" style="margin-top:10px">Reports in this prototype are stored on this device only until a production support backend is connected.</div></div></div>';document.getElementById('safeBack').onclick=()=>show('home');document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>reportCenter({name:b.dataset.report}))}function reportCenter(r={}){main.innerHTML='<div class="wrap"><button class="back" id="reportBack">‹ Back</button><div class="panel"><h2>Report a Problem</h2><div class="muted">'+(r.name?'Rental / issue: '+esc(r.name):'Tell us what happened.')+'</div><label>Problem type</label><select id="rtype"><option>Report User</option><option>Unsafe Equipment</option><option>Damage or Dispute</option><option>Cancel Rental</option><option>Suspected Scam</option><option>Other</option></select><label>What happened?</label><textarea id="rdesc" placeholder="Include only details needed to explain the problem."></textarea><label><input id="urgent" type="checkbox" style="width:auto"> This felt threatening or unsafe</label><div class="dangerbox"><b>If you are in immediate danger:</b> leave the area and contact local emergency services.</div><button class="btn primary full" id="saveReport" style="margin-top:12px">Save Report</button></div></div>';document.getElementById('reportBack').onclick=rentalsView;document.getElementById('saveReport').onclick=()=>{let d=document.getElementById('rdesc').value.trim();if(!d)return alert('Please describe what happened.');let a=get('reports',[]);a.unshift({type:document.getElementById('rtype').value,description:d,urgent:document.getElementById('urgent').checked,date:new Date().toISOString()});set('reports',a);alert('Report saved on this device.');show('profile')}}function profileView(){let p=profile();main.innerHTML='<div class="wrap"><div class="panel"><div class="profile-head"><div class="avatar">👤</div><h2>'+esc(p.name)+'</h2></div><div class="profile-stats"><div><b>'+listings().length+'</b>Listings</div><div><b>'+rentals().length+'</b>Rentals</div><div><b>'+favorites().length+'</b>Favorites</div></div><div class="item"><b>Address</b><div class="muted">'+esc(p.address||'Not entered')+'</div><span class="badge">Private until confirmed rental</span></div><div class="item"><b>Contact</b><div class="muted">'+esc(p.phone||'')+' • '+esc(p.email||'')+'</div></div><button id="safeProfile" class="btn warnbtn full" style="margin-top:12px">🛡️ Safety & How It Works</button><button id="reportProfile" class="btn secondary full" style="margin-top:8px">Report a Problem</button><button id="reset" class="btn danger full" style="margin-top:8px">Reset App Data</button></div></div>';document.getElementById('safeProfile').onclick=safetyCenter;document.getElementById('reportProfile').onclick=()=>reportCenter();document.getElementById('reset').onclick=()=>{if(confirm('Erase local app data?')){localStorage.clear();location.reload()}}}nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.v));if(profile()){nav.classList.remove('hidden');show('home')}else onboard(1);</script></body></html>
