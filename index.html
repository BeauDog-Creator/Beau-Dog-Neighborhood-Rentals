utdoor tools.'},ben:{name:'Ben W.',rating:5,reviews:9,rentals:17,response:'Usually replies within 30 min',member:'Member since 2025',bio:'Trailer and hauling equipment for neighborhood projects.'},jamie:{name:'Jamie P.',rating:4.7,reviews:7,rentals:13,response:'Usually replies within 2 hours',member:'Member since 2026',bio:'Garden and homestead equipment available seasonally.'},chris:{name:'Chris D.',rating:4.9,reviews:14,rentals:28,response:'Usually replies within 45 min',member:'Member since 2024',bio:'Generators and job-site equipment.'}};const demo=[{id:'1',ownerId:'mike',e:'🪵',n:'27-Ton Log Splitter',c:'Lawn & Garden',p:65,w:260,deposit:200,d:4.2,a:'Available today',delivery:'Pickup only',included:['Safety glasses','Operator guide'],rules:['Return with same fuel level','Renter must be 21+'],desc:'Heavy-duty gas log splitter with horizontal and vertical operation.'},{id:'2',ownerId:'sarah',e:'💦',n:'3200 PSI Pressure Washer',c:'Tools',p:38,w:150,deposit:100,d:2.8,a:'Available this weekend',delivery:'Pickup or delivery +$12',included:['25-ft hose','4 spray tips'],rules:['Approved detergent only','Return clean and drained'],desc:'Gas pressure washer for decks, siding and driveways.'},{id:'3',ownerId:'ben',e:'🚚',n:'6×12 Utility Trailer',c:'Trailers',p:45,w:180,deposit:250,d:6.7,a:'Available tomorrow',delivery:'Pickup only',included:['Ramp gate','Spare tire'],rules:['2-inch ball required','Working 4-pin lights required'],desc:'Utility trailer for equipment, materials and dump runs.'},{id:'4',ownerId:'jamie',e:'🌱',n:'Rear-Tine Rototiller',c:'Lawn & Garden',p:52,w:205,deposit:150,d:8.1,a:'Available Friday',delivery:'Pickup or delivery +$15',included:['Depth stake','Operator guide'],rules:['Clean tines before return','No rocky excavation'],desc:'Rear-tine tiller for garden preparation.'},{id:'5',ownerId:'chris',e:'⚡',n:'6500W Portable Generator',c:'Tools',p:70,w:280,deposit:300,d:11.4,a:'Available today',delivery:'Pickup only',included:['Wheel kit','30A adapter'],rules:['Outdoor use only','Return with same fuel level'],desc:'Portable generator for outages and job sites.'}];const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const esc=(x='')=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const profile=()=>get('profile',null),listings=()=>get('listings',[]),needs=()=>get('needs',[]),rentals=()=>get('rentals',[]),messages=()=>get('messages',{}),favorites=()=>get('favorites',[]);let s={role:''},browse={q:'',cat:'All',dist:25,sort:'distance',favoritesOnly:false};function myToDisplay(x,i){return{id:'m'+i,ownerId:'me',e:x.emoji||'🧰',n:x.name,c:x.category||'Tools',p:+x.price||0,w:+x.weekly||((+x.price||0)*5),deposit:+x.deposit||0,d:0,a:x.availability||'Available',delivery:x.delivery||'Pickup only',included:(x.included||'').split(',').map(v=>v.trim()).filter(Boolean),rules:(x.rules||'').split(',').map(v=>v.trim()).filter(Boolean),desc:x.description||'Locally owned equipment available to rent.'}}function allListings(){return[...demo,...listings().map(myToDisplay)]}function ownerFor(x){if(x.ownerId==='me'){let p=profile()||{};return{name:p.name||'You',rating:5,reviews:0,rentals:0,response:'Owner',member:'Your profile',bio:'Your equipment listing.'}}return owners[x.ownerId]}function onboard(step){let body='';if(step===1)body='<h2>Welcome</h2><label>Full name</label><input id="name">';if(step===2)body='<h2>Your address</h2><label>Home address</label><input id="address"><div class="privacy"><b>Private:</b> hidden until a rental is confirmed.</div>';if(step===3)body='<h2>Contact information</h2><label>Phone</label><input id="phone"><label>Email</label><input id="email" type="email">';if(step===4)body='<h2>How will you use the app?</h2><div class="choice" data-r="rent"><b>I want to rent</b></div><div class="choice" data-r="rentout"><b>I want to rent out</b></div><div class="choice" data-r="both"><b>Both</b></div>';if(step===5)body='<h2>What are you looking for?</h2><label>Specific tools/equipment</label><textarea id="needsText"></textarea><label>Search radius</label><select id="radius"><option>5</option><option>10</option><option selected>25</option><option>50</option></select>';if(step===6)body='<h2>What do you rent out?</h2><textarea id="offersText"></textarea>';if(step===7)body='<h2>Finish setup</h2><p>✅ Address privacy enabled</p><p>✅ Identity verification before first paid rental</p><label class="choice"><input id="terms" type="checkbox" style="width:auto"> I agree to the Rental Terms & Safety Agreement.</label>';main.innerHTML='<div class="wrap"><div class="panel">'+body+'<div class="actions">'+(step>1?'<button class="btn secondary" id="back">Back</button>':'')+'<button class="btn primary" id="next">'+(step===7?'Create Profile':'Continue')+'</button></div></div></div>';document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{s.role=x.dataset.r;document.querySelectorAll('[data-r]').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});let b=document.getElementById('back');if(b)b.onclick=()=>onboard(step-1);document.getElementById('next').onclick=()=>{if(step===1){s.name=document.getElementById('name').value.trim();if(!s.name)return alert('Enter your name.')}if(step===2)s.address=document.getElementById('address').value.trim();if(step===3){s.phone=document.getElementById('phone').value.trim();s.email=document.getElementById('email').value.trim()}if(step===4&&!s.role)return alert('Choose Rent, Rent Out, or Both.');if(step===5){s.needs=document.getElementById('needsText').value.trim();s.radius=+document.getElementById('radius').value}if(step===6)s.offers=document.getElementById('offersText').value.trim();if(step===7){if(!document.getElementById('terms').checked)return alert('Please accept the agreement.');set('profile',{...s});nav.classList.remove('hidden');return show('home')}onboard(step+1)}}function show(v){document.querySelectorAll('#nav b v><div class="hero-need"><h3>Can’t find it?</h3><div class="muted">Post what you need and nearby owners can respond.</div><button class="btn primary" id="needNow" style="margin-top:10px">Post “I Need This”</button></div><div class="browse-head"><div><h2 style="margin:0">Available near you</h2><div class="count">'+filtered.length+' listings found</div></div><select id="sort" class="sort"><option value="distance">Closest</option><option value="priceLow">Price: Low</option><option value="priceHigh">Price: High</option><option value="rating">Top Rated</option></select></div></div>'+filtered.map(x=>{let o=ownerFor(x),mine=x.ownerId==='me';return'<div class="card"><div class="picwrap"><div class="pic">'+x.e+'</div><button class="fav" data-fav="'+x.id+'">'+(f.includes(x.id)?'♥':'♡')+'</button></div><div class="body"><div class="row"><div><div class="listing-title">'+esc(x.n)+'</div><div class="meta">'+(mine?'Your listing':x.d+' miles away')+' • '+esc(x.c)+'</div></div><div class="price">$'+x.p+'/day</div></div><div class="rating">⭐ '+o.rating+' <span class="availability">'+esc(x.a)+'</span></div>'+(mine?'<div class="owner-link">Your equipment</div>':'<button class="owner-link" data-owner="'+x.ownerId+'">Owner: '+esc(o.name)+'</button>')+'<div class="two-buttons"><button class="btn secondary" data-detail="'+x.id+'">View Details</button>'+(mine?'<button class="btn primary" data-edit="'+x.id+'">Edit Listing</button>':'<button class="btn primary" data-rent="'+x.id+'">Request Rental</button>')+'</div></div></div>'}).join('')+'</div>';document.getElementById('go').onclick=()=>{browse.q=document.getElementById('search').value.trim();home()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{browse.cat=b.dataset.cat;home()});document.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>{browse.dist=+b.dataset.dist;home()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{browse.q=b.dataset.q;home()});document.getElementById('sort').value=browse.sort;document.getElementById('sort').onchange=e=>{browse.sort=e.target.value;home()};document.getElementById('favFilter').onclick=()=>{browse.favoritesOnly=!browse.favoritesOnly;home()};document.getElementById('needNow').onclick=()=>show('need');document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let fs=favorites();fs=fs.includes(b.dataset.fav)?fs.filter(v=>v!==b.dataset.fav):[...fs,b.dataset.fav];set('favorites',fs);home()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>ownerProfile(b.dataset.owner));document.querySelectorAll('[data-rent]').forEach(b=>b.onclick=()=>requestForm(b.dataset.rent));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editListing(b.dataset.edit))}function detail(id){let x=allListings().find(y=>y.id===id);if(!x)return;let o=ownerFor(x),mine=x.ownerId==='me';main.innerHTML='<div class="wrap"><button class="back" id="backBrowse">‹ Back to browse</button><div class="detail-pic">'+x.e+'</div><div class="detail-title">'+esc(x.n)+'</div><div class="muted">'+(mine?'Your listing':x.d+' miles away')+' • '+esc(x.c)+'</div><div class="detail-grid"><div class="stat"><b>$'+x.p+'</b>per day</div><div class="stat"><b>$'+x.w+'</b>per week</div><div class="stat"><b>$'+x.deposit+'</b>deposit</div><div class="stat"><b>'+esc(x.delivery)+'</b>handoff</div></div><div class="section-title">About this equipment</div><div class="muted">'+esc(x.desc)+'</div><div class="section-title">Owner</div><div class="owner-card"><div class="avatar">👤</div><div><b>'+esc(o.name)+'</b><div class="muted">⭐ '+o.rating+' rating</div><span class="badge">'+(mine?'Your profile':'Verified owner')+'</span></div></div><div class="privacy"><b>Address privacy:</b> Exact pickup addresses stay hidden until the rental is confirmed.</div><div class="sticky-request">'+(mine?'<button class="btn primary full" id="editHere">Edit Your Listing</button>':'<button class="btn primary full" id="detailRent">Request Rental • $'+x.p+'/day</button>')+'</div></div>';document.getElementById('backBrowse').onclick=home;if(mine)document.getElementById('editHere').onclick=()=>editListing(id);else document.getElementById('detailRent').onclick=()=>requestForm(id)}function ownerProfile(ownerId){let o=owners[ownerId];if(!o)return;main.innerHTML='<div class="wrap"><button class="back" id="backBrowse">‹ Back</button><div class="panel"><div class="profile-head"><div class="avatar">👤</div><h2>'+esc(o.name)+'</h2><span class="badge">✓ Verified owner</span></div><div class="profile-stats"><div><b>'+o.rating+'</b>Rating</div><div><b>'+o.rentals+'</b>Rentals</div><div><b>'+o.reviews+'</b>Reviews</div></div><div class="section-title">About</div><div class="muted">'+esc(o.bio)+'</div><div class="section-title">Response time</div><div class="muted">'+esc(o.response)+'</div></div></div>';document.getElementById('backBrowse').onclick=home}function requestForm(id){let x=allListings().find(y=>y.id===id);if(!x||x.ownerId==='me')return;let o=ownerFor(x);main.innerHTML='<div class="wrap"><button class="back" id="backDetail">‹ Back</button><div class="panel"><h2>Request '+esc(x.n)+'</h2><label>Start date</label><input id="start" type="date"><label>Number of days</label><select id="days"><option value="1">1 day</option><option value="2">2 days</option><option value="3">3 days</option><option value="7">7 days</option></select><label>Message to owner</label><textarea id="msg"></textarea><div class="privacy">The owner must approve the request before pickup details are shown.</div><button class="btn primary full" id="sendRequest" style="margin-top:14px">Send Rental Request</button></div></div>';document.getElementById('backDetail').onclick=()=>detail(id);document.getElementById('sendRequest').onclick=()=>{let start=document.getElementById('start').value;if(!start)return alert('Choose a start date.');let a=rentals(),rid='r'+Date.now();a.unshift({id:rid,itemId:x.id,name:x.n,status:'Pending owner approval',start,days:+document.getElementById('days').value,owner:o.name,ownerId:x.ownerId});set('rentals',a);let m=messages();m[rid]=[{from:'me',text:document.getElementById('msg').value||'Hi, I would like to rent this equipment.',time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}];set('messages',m);show('rentals')}}function need(){let a=needs();main.innerHTML='<div class="wrap"><div class="panel"><h2>I Need This</h2><label>What do you need?</label><input id="ni"><label>Budget per day</label><input id="nb" type="number"><button id="post" class="btn primary full" style="margin-top:14px">Post Request</button></div></div>';document.getElementById('post').onclick=()=>{let item=document.getElementById('ni').value.trim();if(!item)return alert('Enter what you need.');let x=needs();x.unshift({item,budget:+document.getElementById('nb').value||0});set('needs',x);alert('Request posted.')}}function listForm(index=null){let a=listings(),x=index===null?{}:a[index]||{};main.innerHTML='<div class="wrap"><div class="panel"><h2>'+(index===null?'List Equipment':'Edit Listing')+'</h2><label>Equipment name</label><input id="ln" value="'+esc(x.name||'')+'"><label>Category</label><select id="lc"><option>Tools</option><option>Lawn & Garden</option><option>Farm</option><option>Trailers</option><option>Construction</option><option>Automotive</option><option>Snow Equipment</option></select><div class="formgrid"><div><label>Daily price</label><input id="lp" type="number" value="'+(x.price||'')+'"></div><div><label>Weekly price</label><input id="lw" type="number" value="'+(x.weekly||'')+'"></div></div><label>Security deposit</label><input id="ld" type="number" value="'+(x.deposit||'')+'"><label>Description</label><textarea id="lDesc">'+esc(x.description||'')+'</textarea><label>Availability</label><input id="lAvail" value="'+esc(x.availability||'Available')+'"><button id="saveListing" class="btn primary full" style="margin-top:14px">Save Listing</button></div></div>';document.getElementById('saveListing').onclick=()=>{let name=document.getElementById('ln').value.trim();if(!name)return alert('Enter equipment name.');let obj={name,category:document.getElementById('lc').value,price:+document.getElementById('lp').value||0,weekly:+document.getElementById('lw').value||0,deposit:+document.getElementById('ld').value||0,description:document.getElementById('lDesc').value.trim(),availability:document.getElementById('lAvail').value.trim()||'Available'};let arr=listings();if(index===null)arr.unshift(obj);else arr[index]=obj;set('listings',arr);show('list')}}function editListing(id){listForm(+id.slice(1))}function listView(){let a=listings();main.innerHTML='<div class="wrap"><div class="panel"><h2>Your Equipment</h2><button id="newListing" class="btn primary full">+ Add Equipment</button></div><div class="panel" style="margin-top:14px">'+(a.length?a.map((x,i)=>'<div class="mylisting"><div class="row"><b>'+esc(x.name)+'</b><span class="price">$'+(+x.price||0)+'/day</span></div><div class="actions"><button class="btn secondary" data-view="m'+i+'">View</button><button class="btn secondary" data-edit="m'+i+'">Edit</button><button class="btn danger" data-del="'+i+'">Remove</button></div></div>').join(''):'<div class="empty">No equipment listed yet.</div>')+'</div></div>';document.getElementById('newListing').onclick=()=>listForm();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>detail(b.dataset.view));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editListing(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let x=listings();x.splice(+b.dataset.del,1);set('listings',x);listView()})}function rentalsView(){let a=rentals(),m=messages();main.innerHTML='<div class="wrap"><div class="panel"><h2>My Rentals</h2>'+(a.length?a.map((x,i)=>{let th=m[x.id]||[],last=th[th.length-1];return'<div class="item"><div class="row"><b>'+esc(x.name)+'</b><span class="badge">'+esc(x.status)+'</span></div>'+(last?'<div class="msg-preview">💬 '+esc(last.text)+'</div>':'')+'<div class="privacy">Exact addresses remain hidden until a rental is confirmed.</div><div class="actions"><button class="btn secondary" data-chat="'+i+'">Message</button><button class="btn danger" data-cr="'+i+'">Cancel</button></div></div>'}).join(''):'<div class="empty">No rental requests yet.</div>')+'</div></div>';document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>chatView(+b.dataset.chat));document.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>{let x=rentals();x.splice(+b.dataset.cr,1);set('rentals',x);rentalsView()})}function chatView(index){let r=rentals()[index];if(!r)return;let m=messages(),thread=m[r.id]||[];main.innerHTML='<div class="wrap"><button class="back" id="backRentals">‹ Back</button><div class="panel"><h2>'+esc(r.owner||'Owner')+'</h2>'+thread.map(x=>'<div class="bubble '+(x.from==='me'?'mine':'theirs')+'">'+esc(x.text)+'</div>').join('')+'<div class="chatbox"><input id="chatInput"><button class="btn primary" id="sendMsg">Send</button></div></div></div>';document.getElementById('backRentals').onclick=rentalsView;document.getElementById('sendMsg').onclick=()=>{let t=document.getElementById('chatInput').value.trim();if(!t)return;let mm=messages();mm[r.id]=mm[r.id]||[];mm[r.id].push({from:'me',text:t});set('messages',mm);chatView(index)}}function profileView(){let p=profile();main.innerHTML='<div class="wrap"><div class="panel"><div class="profile-head"><div class="avatar">👤</div><h2>'+esc(p.name)+'</h2></div><div class="profile-stats"><div><b>'+listings().length+'</b>Listings</div><div><b>'+rentals().length+'</b>Rentals</div><div><b>'+favorites().length+'</b>Favorites</div></div><div class="item"><b>Address</b><div class="muted">'+esc(p.address||'Not entered')+'</div><span class="badge">Private until confirmed rental</span></div><div class="item"><b>Contact</b><div class="muted">'+esc(p.phone||'')+' • '+esc(p.email||'')+'</div></div><button id="reset" class="btn danger full">Reset App Data</button></div></div>';document.getElementById('reset').onclick=()=>{if(confirm('Erase local app data?')){localStorage.clear();location.reload()}}}nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.v));if(profile()){nav.classList.remove('hidden');show('home')}else onboard(1);</script></body></html>
