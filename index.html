<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6b49"><title>Beau Dog Neighbor Rentals</title><style>:root{--g:#2f6b49;--g2:#3f825c;--bg:#f4f6f1;--line:#dfe5de;--muted:#6f7c73;--orange:#d98637}*{box-sizing:border-box}body{margin:0;background:#edf2ec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1d2821}.app{max-width:560px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:82px}.top{padding:22px 18px;color:#fff;background:linear-gradient(135deg,#244e38,#3f7a58)}.brand{display:flex;gap:10px;align-items:center}.paw{width:46px;height:46px;border-radius:14px;background:#f1e4c8;color:#244e38;display:grid;place-items:center;font-size:24px}.top h1{font-size:22px;margin:0}.top p{font-size:12px;opacity:.85;margin:4px 0 0}.wrap{padding:16px 18px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(31,45,37,.08)}.panel{padding:16px}.card{overflow:hidden;margin-top:12px}.pic{height:120px;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,#eee6d7,#dfe7dd)}.body{padding:14px}h2{font-size:19px;margin:0 0 8px}.muted{font-size:12px;color:var(--muted);line-height:1.45}.row{display:flex;justify-content:space-between;gap:10px}.price{font-weight:800;color:var(--g)}label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd6cf;border-radius:12px;background:#fbfcfa;font:inherit}textarea{min-height:86px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:800;font-size:14px}.primary{background:var(--g);color:#fff}.secondary{background:#edf2ed;color:var(--g)}.danger{background:#f8ecea;color:#9f3b32}.full{width:100%}.actions{display:flex;gap:10px;margin-top:14px}.actions .btn{flex:1}.choice{border:1px solid #ccd6cf;border-radius:14px;padding:14px;margin:10px 0;background:#fbfcfa}.choice.selected{background:#edf5ef;border-color:var(--g)}.badge{display:inline-block;background:#edf5ef;color:var(--g);padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;max-width:560px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line)}.bottom button{background:none;border:0;padding:9px 2px;font-size:20px;color:#6f7c73}.bottom span{display:block;font-size:10px;font-weight:700}.bottom button.active{color:var(--g)}.hidden{display:none}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.privacy{background:#f2f7f3;border-left:4px solid var(--g);padding:10px 12px;border-radius:10px;margin-top:10px;font-size:12px;color:#4e5e53}.empty{text-align:center;padding:18px;color:var(--muted);font-size:13px}.searchbox{display:flex;gap:8px}.searchbox input{flex:1}.filters{display:flex;gap:8px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #ccd6cf;background:#fff;border-radius:999px;padding:8px 11px;font-weight:700;font-size:12px}.filter.active{background:var(--g);border-color:var(--g);color:#fff}.browse-head{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}.count{font-size:12px;color:var(--muted)}.sort{width:auto;padding:8px 10px}.hero-need{background:linear-gradient(135deg,#fff5e4,#f2dfba);border:1px solid #e7d2a7;border-radius:16px;padding:14px;margin-top:14px}.hero-need h3{margin:0 0 4px;font-size:16px}.hero-need p{margin:0 0 10px;font-size:12px;color:#6f624d}.listing-top{display:flex;justify-content:space-between;gap:10px}.listing-title{font-weight:800;font-size:16px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.rating{font-size:12px;margin-top:8px}.availability{display:inline-block;background:#edf5ef;color:var(--g);font-size:11px;font-weight:700;border-radius:999px;padding:4px 7px;margin-left:6px}.owner-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.owner{font-size:12px;color:#4f5f55}.favorite{background:#fff;border:1px solid #d8dfd9;border-radius:50%;width:36px;height:36px;font-size:18px}.two-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.quick button{border:1px solid #d9e1da;background:#fff;border-radius:14px;padding:10px 4px;font-size:11px;font-weight:700;color:#536158}.quick b{display:block;font-size:21px;margin-bottom:3px}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="paw">🐾</div><div><h1>Beau Dog Neighbor Rentals</h1><p>Tools and equipment from people nearby</p></div></div></header><main id="main"></main><nav id="nav" class="bottom hidden"><button data-v="home">🏠<span>Home</span></button><button data-v="need">📣<span>Need</span></button><button data-v="list">➕<span>List</span></button><button data-v="rentals">📋<span>Rentals</span></button><button data-v="profile">👤<span>Profile</span></button></nav></div><script>const main=document.getElementById('main'),nav=document.getElementById('nav');const demo=[{id:'1',e:'🪵',n:'27-Ton Log Splitter',c:'Lawn & Garden',p:65,d:4.2,o:'Mike R.',r:4.9,revs:18,a:'Available today'},{id:'2',e:'💦',n:'3200 PSI Pressure Washer',c:'Tools',p:38,d:2.8,o:'Sarah T.',r:4.8,revs:11,a:'Available this weekend'},{id:'3',e:'🚚',n:'6×12 Utility Trailer',c:'Trailers',p:45,d:6.7,o:'Ben W.',r:5.0,revs:9,a:'Available tomorrow'},{id:'4',e:'🌱',n:'Rear-Tine Rototiller',c:'Lawn & Garden',p:52,d:8.1,o:'Jamie P.',r:4.7,revs:7,a:'Available Friday'},{id:'5',e:'⚡',n:'6500W Portable Generator',c:'Tools',p:70,d:11.4,o:'Chris D.',r:4.9,revs:14,a:'Available today'}];const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let s={role:''},browse={q:'',cat:'All',dist:25,sort:'distance'};function esc(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function profile(){return get('profile',null)}function listings(){return get('listings',[])}function needs(){return get('needs',[])}function rentals(){return get('rentals',[])}function onboard(step){let body='';if(step===1)body='<h2>Welcome</h2><label>Full name</label><input id="name" placeholder="Your name">';if(step===2)body='<h2>Your address</h2><label>Home address</label><input id="address" placeholder="Street, city, state, ZIP"><div class="privacy"><b>Private:</b> hidden until a rental is confirmed.</div>';if(step===3)body='<h2>Contact information</h2><label>Phone</label><input id="phone"><label>Email</label><input id="email" type="email">';if(step===4)body='<h2>How will you use the app?</h2><div class="choice" data-r="rent"><b>I want to rent</b></div><div class="choice" data-r="rentout"><b>I want to rent out</b></div><div class="choice" data-r="both"><b>Both</b></div>';if(step===5)body='<h2>What are you looking for?</h2><label>Specific tools/equipment</label><textarea id="needsText"></textarea><label>Search radius</label><select id="radius"><option>5</option><option>10</option><option selected>25</option><option>50</option></select>';if(step===6)body='<h2>What do you rent out?</h2><label>Tools/equipment offered</label><textarea id="offersText"></textarea>';if(step===7)body='<h2>Finish setup</h2><p>✅ Address privacy enabled</p><p>✅ Identity verification before first paid rental</p><label class="choice"><input id="terms" type="checkbox" style="width:auto"> I agree to the Rental Terms & Safety Agreement.</label>';main.innerHTML='<div class="wrap"><div class="panel">'+body+'<div class="actions">'+(step>1?'<button class="btn secondary" id="back">Back</button>':'')+'<button class="btn primary" id="next">'+(step===7?'Create Profile':'Continue')+'</button></div></div></div>';document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{s.role=x.dataset.r;document.querySelectorAll('[data-r]').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});let b=document.getElementById('back');if(b)b.onclick=()=>onboard(step-1);document.getElementById('next').onclick=()=>{if(step===1){s.name=document.getElementById('name').value.trim();if(!s.name)return alert('Enter your name.')}if(step===2)s.address=document.getElementById('address').value.trim();if(step===3){s.phone=document.getElementById('phone').value.trim();s.email=document.getElementById('email').value.trim()}if(step===4&&!s.role)return alert('Choose Rent, Rent Out, or Both.');if(step===5){s.needs=document.getElementById('needsText').value.trim();s.radius=+document.getElementById('radius').value}if(step===6)s.offers=document.getElementById('offersText').value.trim();if(step===7){if(!document.getElementById('terms').checked)return alert('Please accept the agreement.');set('profile',{...s});nav.classList.remove('hidden');return show('home')}onboard(step+1)}}function show(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if(v==='home')home();if(v==='need')need();if(v==='list')list();if(v==='rentals')rentalsView();if(v==='profile')profileView();scrollTo(0,0)}function home(){let p=profile(),mine=listings().map((x,i)=>({id:'m'+i,e:'🧰',n:x.name,c:x.category,p:x.price,d:0,o:'You',r:5,revs:0,a:'Your listing'}));let all=[...demo,...mine],cats=['All','Tools','Lawn & Garden','Trailers','Construction','Farm'];let filtered=all.filter(x=>(browse.cat==='All'||x.c===browse.cat)&&x.d<=browse.dist&&(!browse.q||x.n.toLowerCase().includes(browse.q.toLowerCase())||x.c.toLowerCase().includes(browse.q.toLowerCase())));if(browse.sort==='distance')filtered.sort((a,b)=>a.d-b.d);if(browse.sort==='priceLow')filtered.sort((a,b)=>a.p-b.p);if(browse.sort==='priceHigh')filtered.sort((a,b)=>b.p-a.p);if(browse.sort==='rating')filtered.sort((a,b)=>b.r-a.r);main.innerHTML='<div class="wrap"><div class="panel"><h2>Browse nearby equipment</h2><div class="muted">Hi '+esc(p.name)+'. Find what you need close to home.</div><div class="searchbox"><input id="search" placeholder="Search log splitter, trailer, generator..." value="'+esc(browse.q)+'"><button class="btn primary" id="go">Search</button></div><div class="filters">'+cats.map(c=>'<button class="filter '+(browse.cat===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('')+'</div><div class="quick"><button data-q="generator"><b>⚡</b>Generators</button><button data-q="trailer"><b>🚚</b>Trailers</button><button data-q="pressure"><b>💦</b>Washers</button><button data-q="tiller"><b>🌱</b>Tillers</button></div><label>Distance</label><div class="filters">'+[5,10,25,50].map(d=>'<button class="filter '+(browse.dist===d?'active':'')+'" data-dist="'+d+'">'+d+' mi</button>').join('')+'</div><div class="hero-need"><h3>Can’t find it?</h3><p>Post what you need and nearby owners can respond.</p><button class="btn primary" id="needNow">Post “I Need This”</button></div><div class="browse-head"><div><h2 style="margin:0">Available near you</h2><div class="count">'+filtered.length+' listings found</div></div><select id="sort" class="sort"><option value="distance" '+(browse.sort==='distance'?'selected':'')+'>Closest</option><option value="priceLow" '+(browse.sort==='priceLow'?'selected':'')+'>Price: Low</option><option value="priceHigh" '+(browse.sort==='priceHigh'?'selected':'')+'>Price: High</option><option value="rating" '+(browse.sort==='rating'?'selected':'')+'>Top Rated</option></select></div></div>'+filtered.map(x=>'<div class="card"><div class="pic">'+x.e+'</div><div class="body"><div class="listing-top"><div><div class="listing-title">'+esc(x.n)+'</div><div class="meta">'+(x.o==='You'?'Your listing':x.d+' miles away')+' • '+esc(x.c)+'</div></div><button class="favorite">♡</button></div><div class="rating">⭐ '+x.r+' '+(x.revs?'('+x.revs+' reviews)':'')+'<span class="availability">'+esc(x.a)+'</span></div><div class="owner-row"><div class="owner">Owner: '+esc(x.o)+'</div><div class="price">$'+x.p+'/day</div></div>'+(x.o==='You'?'':'<div class="two-buttons"><button class="btn secondary" data-detail="'+x.id+'">View Details</button><button class="btn primary" data-rent="'+x.id+'">Request Rental</button></div>')+'</div></div>').join('')+(filtered.length?'':'<div class="panel" style="margin-top:12px"><div class="empty">No equipment matches those filters.</div></div>')+'</div>';document.getElementById('go').onclick=()=>{browse.q=document.getElementById('search').value.trim();home()};document.getElementById('search').onkeydown=e=>{if(e.key==='Enter'){browse.q=e.target.value.trim();home()}};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{browse.cat=b.dataset.cat;home()});document.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>{browse.dist=+b.dataset.dist;home()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{browse.q=b.dataset.q;home()});document.getElementById('sort').onchange=e=>{browse.sort=e.target.value;home()};document.getElementById('needNow').onclick=()=>show('need');document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{let x=demo.find(y=>y.id===b.dataset.detail);alert(x.n+'\n\n$'+x.p+'/day\n'+x.d+' miles away\nOwner: '+x.o+'\nRating: '+x.r)});document.querySelectorAll('[data-rent]').forEach(b=>b.onclick=()=>{let x=demo.find(y=>y.id===b.dataset.rent),a=rentals();a.unshift({name:x.n,status:'Pending owner approval'});set('rentals',a);show('rentals')})}function need(){let a=needs();main.innerHTML='<div class="wrap"><div class="panel"><h2>I Need This</h2><label>What do you need?</label><input id="ni"><label>Budget per day</label><input id="nb" type="number"><button id="post" class="btn primary full" style="margin-top:14px">Post Request</button></div><div class="panel" style="margin-top:14px">'+(a.length?a.map((x,i)=>'<div class="item"><div class="row"><b>'+esc(x.item)+'</b><span class="badge">Active</span></div><div class="muted">Budget $'+x.budget+'/day</div><button class="btn danger" data-dn="'+i+'" style="margin-top:8px">Remove</button></div>').join(''):'<div class="empty">No requests yet.</div>')+'</div></div>';document.getElementById('post').onclick=()=>{let item=document.getElementById('ni').value.trim();if(!item)return alert('Enter what you need.');let x=needs();x.unshift({item,budget:+document.getElementById('nb').value||0});set('needs',x);need()};document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{let x=needs();x.splice(+b.dataset.dn,1);set('needs',x);need()})}function list(){let a=listings();main.innerHTML='<div class="wrap"><div class="panel"><h2>List Equipment</h2><label>Equipment name</label><input id="ln"><label>Category</label><select id="lc"><option>Tools</option><option>Lawn & Garden</option><option>Farm</option><option>Trailers</option><option>Construction</option><option>Automotive</option><option>Snow Equipment</option></select><label>Daily price</label><input id="lp" type="number"><label>Security deposit</label><input id="ld" type="number"><button id="pub" class="btn primary full" style="margin-top:14px">Publish Listing</button></div><div class="panel" style="margin-top:14px">'+(a.length?a.map((x,i)=>'<div class="item"><div class="row"><b>'+esc(x.name)+'</b><span class="price">$'+x.price+'/day</span></div><div class="muted">'+esc(x.category)+'</div><button class="btn danger" data-dl="'+i+'" style="margin-top:8px">Remove Listing</button></div>').join(''):'<div class="empty">No listings yet.</div>')+'</div></div>';document.getElementById('pub').onclick=()=>{let name=document.getElementById('ln').value.trim();if(!name)return alert('Enter equipment name.');let x=listings();x.unshift({name,category:document.getElementById('lc').value,price:+document.getElementById('lp').value||0,deposit:+document.getElementById('ld').value||0});set('listings',x);list()};document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{let x=listings();x.splice(+b.dataset.dl,1);set('listings',x);list()})}function rentalsView(){let a=rentals();main.innerHTML='<div class="wrap"><div class="panel"><h2>My Rentals</h2>'+(a.length?a.map((x,i)=>'<div class="item"><div class="row"><b>'+esc(x.name)+'</b><span class="badge">'+esc(x.status)+'</span></div><div class="privacy">Exact addresses remain hidden until a rental is confirmed.</div><button class="btn danger" data-cr="'+i+'" style="margin-top:8px">Cancel</button></div>').join(''):'<div class="empty">No rental requests yet.</div>')+'</div></div>';document.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>{let x=rentals();x.splice(+b.dataset.cr,1);set('rentals',x);rentalsView()})}function profileView(){let p=profile();main.innerHTML='<div class="wrap"><div class="panel"><div class="item"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.role||'')+'</div></div><div class="item"><b>Address</b><div class="muted">'+esc(p.address||'Not entered')+'</div><span class="badge">Private until confirmed rental</span></div><div class="item"><b>Contact</b><div class="muted">'+esc(p.phone||'')+' • '+esc(p.email||'')+'</div></div><button id="reset" class="btn danger full" style="margin-top:14px">Reset App Data</button></div></div>';document.getElementById('reset').onclick=()=>{if(confirm('Erase local app data?')){localStorage.clear();location.reload()}}}nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.v));if(profile()){nav.classList.remove('hidden');show('home')}else onboard(1);</script></body></html>
