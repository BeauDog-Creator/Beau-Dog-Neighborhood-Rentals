><nav id="nav" class="bottom hidden"><button data-v="home">🏠<span>Home</span></button><button data-v="need">📣<span>Need</span></button><button data-v="list">➕<span>List</span></button><button data-v="rentals">📋<span>Rentals</span></button><button data-v="profile">👤<span>Profile</span></button></nav></div><script>const main=document.getElementById('main'),nav=document.getElementById('nav');const demo=[{id:'1',e:'🪵',n:'27-Ton Log Splitter',c:'Lawn & Garden',p:65,w:260,deposit:200,d:4.2,o:'Mike R.',r:4.9,revs:18,a:'Available today',delivery:'Pickup only',included:['Safety glasses','Operator guide','Full hydraulic fluid check'],rules:['Return with same fuel level','No commercial tree-service use','Renter must be 21+'],desc:'Heavy-duty gas log splitter with horizontal and vertical operation. Great for firewood, storm cleanup, and seasonal splitting.'},{id:'2',e:'💦',n:'3200 PSI Pressure Washer',c:'Tools',p:38,w:150,deposit:100,d:2.8,o:'Sarah T.',r:4.8,revs:11,a:'Available this weekend',delivery:'Pickup or delivery +$12',included:['25-ft hose','4 spray tips','Detergent siphon tube'],rules:['Use approved pressure-washer detergent only','Return clean and drained','Do not run pump dry'],desc:'Gas pressure washer for decks, siding, driveways, equipment, and outdoor cleanup.'},{id:'3',e:'🚚',n:'6×12 Utility Trailer',c:'Trailers',p:45,w:180,deposit:250,d:6.7,o:'Ben W.',r:5.0,revs:9,a:'Available tomorrow',delivery:'Pickup only',included:['Ramp gate','Spare tire','Tie-down points'],rules:['2-inch ball required','Working 4-pin trailer lights required','No overloaded loads'],desc:'Versatile utility trailer for lawn equipment, building materials, ATVs, and dump runs.'},{id:'4',e:'🌱',n:'Rear-Tine Rototiller',c:'Lawn & Garden',p:52,w:205,deposit:150,d:8.1,o:'Jamie P.',r:4.7,revs:7,a:'Available Friday',delivery:'Pickup or local delivery +$15',included:['Depth stake','Operator guide'],rules:['Clean soil from tines before return','No rocky excavation','Use fresh gasoline'],desc:'Rear-tine tiller suited for garden preparation, established beds, and breaking compacted soil.'},{id:'5',e:'⚡',n:'6500W Portable Generator',c:'Tools',p:70,w:280,deposit:300,d:11.4,o:'Chris D.',r:4.9,revs:14,a:'Available today',delivery:'Pickup only',included:['Wheel kit','30A adapter','Operator guide'],rules:['Outdoor use only','Return with same fuel level','Do not exceed rated wattage'],desc:'Portable generator for outages, camps, job sites, and remote power needs.'}];const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let s={role:''},browse={q:'',cat:'All',dist:25,sort:'distance'};function esc(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function profile(){return get('profile',null)}function listings(){return get('listings',[])}function needs(){return get('needs',[])}function rentals(){return get('rentals',[])}function onboard(step){let body='';if(step===1)body='<h2>Welcome</h2><label>Full name</label><input id="name" placeholder="Your name">';if(step===2)body='<h2>Your address</h2><label>Home address</label><input id="address" placeholder="Street, city, state, ZIP"><div class="privacy"><b>Private:</b> hidden until a rental is confirmed.</div>';if(step===3)body='<h2>Contact information</h2><label>Phone</label><input id="phone"><label>Email</label><input id="email" type="email">';if(step===4)body='<h2>How will you use the app?</h2><div class="choice" data-r="rent"><b>I want to rent</b></div><div class="choice" data-r="rentout"><b>I want to rent out</b></div><div class="choice" data-r="both"><b>Both</b></div>';if(step===5)body='<h2>What are you looking for?</h2><label>Specific tools/equipment</label><textarea id="needsText"></textarea><label>Search radius</label><select id="radius"><option>5</option><option>10</option><option selected>25</option><option>50</option></select>';if(step===6)body='<h2>What do you rent out?</h2><label>Tools/equipment offered</label><textarea id="offersText"></textarea>';if(step===7)body='<h2>Finish setup</h2><p>✅ Address privacy enabled</p><p>✅ Identity verification before first paid rental</p><label class="choice"><input id="terms" type="checkbox" style="width:auto"> I agree to the Rental Terms & Safety Agreement.</label>';main.innerHTML='<div class="wrap"><div class="panel">'+body+'<div class="actions">'+(step>1?'<button class="btn secondary" id="back">Back</button>':'')+'<button class="btn primary" id="next">'+(step===7?'Create Profile':'Continue')+'</button></div></div></div>';document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{s.role=x.dataset.r;document.querySelectorAll('[data-r]').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});let b=document.getElementById('back');if(b)b.onclick=()=>onboard(step-1);document.getElementById('next').onclick=()=>{if(step===1){s.name=document.getElementById('name').value.trim();if(!s.name)return alert('Enter your name.')}if(step===2)s.address=document.getElementById('address').value.trim();if(step===3){s.phone=document.getElementById('phone').value.trim();s.email=document.getElementById('email').value.trim()}if(step===4&&!s.role)return alert('Choose Rent, Rent Out, or Both.');if(step===5){s.needs=document.getElementById('needsText').value.trim();s.radius=+document.getElementById('radius').value}if(step===6)s.offers=document.getElementById('offersText').value.trim();if(step===7){if(!document.getElementById('terms').checked)return alert('Please accept the agreement.');set('profile',{...s});nav.classList.remove('hidden');return show('home')}onboard(step+1)}}function show(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if(v==='home')home();if(v==='need')need();if(v==='list')list();if(v==='rentals')rentalsView();if(v==='profile')profileView();scrollTo(0,0)}function home(){let p=profile(),mine=listings().map((x,i)=>({id:'m'+i,e:'🧰',n:x.name,c:x.category,p:x.price,d:0,o:'You',r:5,revs:0,a:'Your listing'}));let all=[...demo,...mine],cats=['All','Tools','Lawn & Garden','Trailers','Construction','Farm'];let filtered=all.filter(x=>(browse.cat==='All'||x.c===browse.cat)&&x.d<=browse.dist&&(!browse.q||x.n.toLowerCase().includes(browse.q.toLowerCase())||x.c.toLowerCase().includes(browse.q.toLowerCase())));if(browse.sort==='distance')filtered.sort((a,b)=>a.d-b.d);if(browse.sort==='priceLow')filtered.sort((a,b)=>a.p-b.p);if(browse.sort==='priceHigh')filtered.sort((a,b)=>b.p-a.p);if(browse.sort==='rating')filtered.sort((a,b)=>b.r-a.r);main.innerHTML='<div class="wrap"><div class="panel"><h2>Browse nearby equipment</h2><div class="muted">Hi '+esc(p.name)+'. Find what you need close to home.</div><div class="searchbox"><input id="search" placeholder="Search log splitter, trailer, generator..." value="'+esc(browse.q)+'"><button class="btn primary" id="go">Search</button></div><div class="filters">'+cats.map(c=>'<button class="filter '+(browse.cat===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('')+'</div><div class="quick"><button data-q="generator"><b>⚡</b>Generators</button><button data-q="trailer"><b>🚚</b>Trailers</button><button data-q="pressure"><b>💦</b>Washers</button><button data-q="tiller"><b>🌱</b>Tillers</button></div><label>Distance</label><div class="filters">'+[5,10,25,50].map(d=>'<button class="filter '+(browse.dist===d?'active':'')+'" data-dist="'+d+'">'+d+' mi</button>').join('')+'</div><div class="hero-need"><h3>Can’t find it?</h3><p>Post what you need and nearby owners can respond.</p><button class="btn primary" id="needNow">Post “I Need This”</button></div><div class="browse-head"><div><h2 style="margin:0">Available near you</h2><div class="count">'+filtered.length+' listings found</div></div><select id="sort" class="sort"><option value="distance" '+(browse.sort==='distance'?'selected':'')+'>Closest</option><option value="priceLow" '+(browse.sort==='priceLow'?'selected':'')+'>Price: Low</option><option value="priceHigh" '+(browse.sort==='priceHigh'?'selected':'')+'>Price: High</option><option value="rating" '+(browse.sort==='rating'?'selected':'')+'>Top Rated</option></select></div></div>'+filtered.map(x=>'<div class="card"><div class="pic">'+x.e+'</div><div class="body"><div class="row"><div><div class="listing-title">'+esc(x.n)+'</div><div class="meta">'+(x.o==='You'?'Your listing':x.d+' miles away')+' • '+esc(x.c)+'</div></div><div class="price">$'+x.p+'/day</div></div><div class="rating">⭐ '+x.r+' '+(x.revs?'('+x.revs+' reviews)':'')+'<span class="availability">'+esc(x.a)+'</span></div><div class="owner-row"><div class="owner">Owner: '+esc(x.o)+'</div></div>'+(x.o==='You'?'':'<div class="two-buttons"><button class="btn secondary" data-detail="'+x.id+'">View Details</button><button class="btn primary" data-rent="'+x.id+'">Request Rental</button></div>')+'</div></div>').join('')+(filtered.length?'':'<div class="panel" style="margin-top:12px"><div class="empty">No equipment matches those filters.</div></div>')+'</div>';document.getElementById('go').onclick=()=>{browse.q=document.getElementById('search').value.trim();home()};document.getElementById('search').onkeydown=e=>{if(e.key==='Enter'){browse.q=e.target.value.trim();home()}};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{browse.cat=b.dataset.cat;home()});document.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>{browse.dist=+b.dataset.dist;home()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{browse.q=b.dataset.q;home()});document.getElementById('sort').onchange=e=>{browse.sort=e.target.value;home()};document.getElementById('needNow').onclick=()=>show('need');document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-rent]').forEach(b=>b.onclick=()=>requestForm(b.dataset.rent))}function detail(id){let x=demo.find(y=>y.id===id);if(!x)return;main.innerHTML='<div class="wrap"><button class="back" id="backBrowse">‹ Back to browse</button><div class="detail-pic">'+x.e+'</div><div class="detail-title">'+esc(x.n)+'</div><div class="muted">'+x.d+' miles away • '+esc(x.c)+'</div><div class="rating">⭐ '+x.r+' ('+x.revs+' reviews) <span class="availability">'+esc(x.a)+'</span></div><div class="detail-grid"><div class="stat"><b>$'+x.p+'</b>per day</div><div class="stat"><b>$'+x.w+'</b>per week</div><div class="stat"><b>$'+x.deposit+'</b>security deposit</div><div class="stat"><b>'+esc(x.delivery)+'</b>handoff</div></div><div class="section-title">About this equipment</div><div class="muted" style="font-size:13px">'+esc(x.desc)+'</div><div class="section-title">Owner</div><div class="owner-card"><div class="avatar">👤</div><div><b>'+esc(x.o)+'</b><div class="muted">⭐ '+x.r+' rating • '+x.revs+' completed reviews</div><span class="badge">Verified owner</span></div></div><div class="section-title">Included with rental</div>'+x.included.map(v=>'<div class="check">✅ '+esc(v)+'</div>').join('')+'<div class="section-title">Rental rules</div>'+x.rules.map(v=>'<div class="check">• '+esc(v)+'</div>').join('')+'<div class="privacy"><b>Address privacy:</b> The owner’s exact pickup address stays hidden until the rental is confirmed.</div><div class="sticky-request"><button class="btn primary full" id="detailRent">Request Rental • $'+x.p+'/day</button></div></div>';document.getElementById('backBrowse').onclick=home;document.getElementById('detailRent').onclick=()=>requestForm(id);scrollTo(0,0)}function requestForm(id){let x=demo.find(y=>y.id===id);if(!x)return;main.innerHTML='<div class="wrap"><button class="back" id="backDetail">‹ Back</button><div class="panel"><h2>Request '+esc(x.n)+'</h2><div class="muted">Owner: '+esc(x.o)+' • '+x.d+' miles away</div><label>Start date</label><input id="start" type="date"><label>Number of days</label><select id="days"><option value="1">1 day</option><option value="2">2 days</option><option value="3">3 days</option><option value="4">4 days</option><option value="7">7 days</option></select><label>Pickup / delivery</label><select id="handoff"><option>'+esc(x.delivery)+'</option></select><label>Message to owner</label><textarea id="msg" placeholder="Tell the owner what you’re using it for or ask a question."></textarea><div id="cost" class="summary-box"></div><div class="privacy">Your payment is not completed in this prototype. The owner must approve the request first.</div><button class="btn primary full" id="sendRequest" style="margin-top:14px">Send Rental Request</button></div></div>';function cost(){let days=+document.getElementById('days').value,rental=days>=7?x.w:x.p*days;document.getElementById('cost').innerHTML='<div class="summary-row"><span>Rental</span><b>$'+rental+'</b></div><div class="summary-row"><span>Security deposit</span><b>$'+x.deposit+'</b></div><div class="summary-row total"><span>Authorization total</span><span>$'+(rental+x.deposit)+'</span></div>'}cost();document.getElementById('days').onchange=cost;document.getElementById('backDetail').onclick=()=>detail(id);document.getElementById('sendRequest').onclick=()=>{let start=document.getElementById('start').value;if(!start)return alert('Choose a start date.');let days=+document.getElementById('days').value,a=rentals();a.unshift({name:x.n,status:'Pending owner approval',start,days,owner:x.o,message:document.getElementById('msg').value});set('rentals',a);alert('Rental request sent to '+x.o+'.');show('rentals')}}function need(){let a=needs();main.innerHTML='<div class="wrap"><div class="panel"><h2>I Need This</h2><label>What do you need?</label><input id="ni"><label>Budget per day</label><input id="nb" type="number"><button id="post" class="btn primary full" style="margin-top:14px">Post Request</button></div><div class="panel" style="margin-top:14px">'+(a.length?a.map((x,i)=>'<div class="item"><div class="row"><b>'+esc(x.item)+'</b><span class="badge">Active</span></div><div class="muted">Budget $'+x.budget+'/day</div><button class="btn danger" data-dn="'+i+'" style="margin-top:8px">Remove</button></div>').join(''):'<div class="empty">No requests yet.</div>')+'</div></div>';document.getElementById('post').onclick=()=>{let item=document.getElementById('ni').value.trim();if(!item)return alert('Enter what you need.');let x=needs();x.unshift({item,budget:+document.getElementById('nb').value||0});set('needs',x);need()};document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{let x=needs();x.splice(+b.dataset.dn,1);set('needs',x);need()})}function list(){let a=listings();main.innerHTML='<div class="wrap"><div class="panel"><h2>List Equipment</h2><label>Equipment name</label><input id="ln"><label>Category</label><select id="lc"><option>Tools</option><option>Lawn & Garden</option><option>Farm</option><option>Trailers</option><option>Construction</option><option>Automotive</option><option>Snow Equipment</option></select><label>Daily price</label><input id="lp" type="number"><label>Security deposit</label><input id="ld" type="number"><button id="pub" class="btn primary full" style="margin-top:14px">Publish Listing</button></div><div class="panel" style="margin-top:14px">'+(a.length?a.map((x,i)=>'<div class="item"><div class="row"><b>'+esc(x.name)+'</b><span class="price">$'+x.price+'/day</span></div><div class="muted">'+esc(x.category)+'</div><button class="btn danger" data-dl="'+i+'" style="margin-top:8px">Remove Listing</button></div>').join(''):'<div class="empty">No listings yet.</div>')+'</div></div>';document.getElementById('pub').onclick=()=>{let name=document.getElementById('ln').value.trim();if(!name)return alert('Enter equipment name.');let x=listings();x.unshift({name,category:document.getElementById('lc').value,price:+document.getElementById('lp').value||0,deposit:+document.getElementById('ld').value||0});set('listings',x);list()};document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{let x=listings();x.splice(+b.dataset.dl,1);set('listings',x);list()})}function rentals
