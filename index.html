<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6b49"><title>Beau Dog Neighbor Rentals</title><style>:root{--g:#2f6b49;--bg:#f4f6f1;--line:#dfe5de;--muted:#6f7c73;--red:#9f3b32;--gold:#a66f18}*{box-sizing:border-box}body{margin:0;background:#edf2ec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1d2821}.app{max-width:560px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:82px}.top{padding:22px 18px;color:#fff;background:linear-gradient(135deg,#244e38,#3f7a58)}.brand{display:flex;gap:10px;align-items:center}.paw{width:46px;height:46px;border-radius:14px;background:#f1e4c8;color:#244e38;display:grid;place-items:center;font-size:24px}.top h1{font-size:22px;margin:0}.top p{font-size:12px;opacity:.85;margin:4px 0 0}.wrap{padding:16px 18px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(31,45,37,.08)}.panel{padding:16px}.card{overflow:hidden;margin-top:12px}.pic,.detailpic{display:grid;place-items:center;background:linear-gradient(135deg,#eee6d7,#dfe7dd)}.pic{height:135px;font-size:60px}.detailpic{height:220px;font-size:92px;border-radius:18px}.body{padding:14px}h2{font-size:19px;margin:0 0 8px}h3{margin:0 0 7px}.muted{font-size:12px;color:var(--muted);line-height:1.45}.row{display:flex;justify-content:space-between;gap:10px}.price{font-weight:850;color:var(--g)}label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd6cf;border-radius:12px;background:#fbfcfa;font:inherit}textarea{min-height:84px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:800;font-size:14px;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#edf2ed;color:var(--g)}.danger{background:#f8ecea;color:var(--red)}.gold{background:#fff4df;color:#87580c;border:1px sol :12px;top:12px;width:40px;height:40px;border-radius:50%;border:1px solid #dbe2dc;background:#fff;font-size:21px}.picwrap{position:relative}.back{background:none;border:0;color:var(--g);font-weight:800;padding:0 0 12px;font-size:14px}.detail-title{font-size:23px;font-weight:850;margin:14px 0 3px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stat{background:#f5f8f5;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;color:var(--g);font-size:17px}.profile-head{text-align:center}.avatar{width:70px;height:70px;border-radius:50%;background:#e7efe8;display:grid;place-items:center;font-size:34px;margin:0 auto 8px}.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.profile-stats div{background:#f5f8f5;border-radius:13px;padding:10px;text-align:center;font-size:11px;color:var(--muted)}.profile-stats b{display:block;font-size:17px;color:var(--g)}.plan{border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.plan.plus{border-color:#d7b56b;background:#fffaf0}.planprice{font-size:28px;font-weight:900;color:var(--g)}.plan ul{padding-left:20px}.plan li{margin:8px 0;font-size:13px}.choice{border:1px solid #ccd6cf;border-radius:14px;padding:14px;margin:10px 0;background:#fbfcfa}.choice.selected{background:#edf5ef;border-color:var(--g)}.step{display:flex;gap:10px;margin:12px 0}.stepnum{width:28px;height:28px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:850;flex:0 0 auto}.safety-list{padding-left:20px}.safety-list li{margin:8px 0;font-size:13px;line-height:1.4}.mylisting{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fbfcfa}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="paw">🐾</div><div><h1>Beau Dog Neighbor Rentals</h1><p>Tools and equipment from people nearby</p></div></div></header><main id="main"></main><nav id="nav" class="bottom hidden"><button data-v="home">🏠<span>Home</span></button><button data-v="need">📣<span>Need</span></button><button data-v="list">➕<span>List</span></button><button data-v="rentals">📋<span>Rentals</span></button><button data-v="profile">👤<span>Profile</span></button></nav></div><script>const main=document.getElementById('main'),nav=document.getElementById('nav');const demo=[{id:'1',e:'🪵',n:'27-Ton Log Splitter',c:'Lawn & Garden',p:65,w:260,d:4.2,a:'Available today',owner:'Mike R.'},{id:'2',e:'💦',n:'3200 PSI Pressure Washer',c:'Tools',p:38,w:150,d:2.8,a:'Available this weekend',owner:'Sarah T.'},{id:'3',e:'🚚',n:'6×12 Utility Trailer',c:'Trailers',p:45,w:180,d:6.7,a:'Available tomorrow',owner:'Ben W.'},{id:'4',e:'🌱',n:'Rear-Tine Rototiller',c:'Lawn & Garden',p:52,w:205,d:8.1,a:'Available Friday',owner:'Jamie P.'},{id:'5',e:'⚡',n:'6500W Portable Generator',c:'Tools',p:70,w:280,d:11.4,a:'Available today',owner:'Chris D.'}];const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const esc=(x='')=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const profile=()=>get('profile',null),listings=()=>get('listings',[]),needs=()=>get('needs',[]),rentals=()=>get('rentals',[]),favorites=()=>get('favorites',[]),plan=()=>get('plan','free');let onboardData={role:''},browse={q:'',dist:25,favoritesOnly:false};function allListings(){return[...demo,...listings().map((x,i)=>({id:'m'+i,e:x.emoji||'🧰',n:x.name,c:x.category||'Tools',p:+x.price||0,w:+x.weekly||(+x.price||0)*5,d:0,a:x.availability||'Available',owner:'You',mine:true}))]}function onboard(step){let b='';if(step===1)b='<h2>Welcome</h2><label>Full name</label><input id="name">';if(step===2)b='<h2>Your address</h2><label>Home address</label><input id="address"><div class="privacy"><b>Private:</b> hidden until a rental is confirmed.</div>';if(step===3)b='<h2>Contact</h2><label>Phone</label><input id="phone"><label>Email</label><input id="email">';if(step===4)b='<h2>How will you use the app?</h2><div class="choice" data-role="rent">I want to rent</div><div class="choice" data-role="rentout">I want to rent out</div><div class="choice" data-role="both">Both</div>';if(step===5)b='<h2>Search radius</h2><select id="radius"><option>5</option><option>10</option><option selected>25</option><option>50</option></select>';if(step===6)b='<h2>Finish setup</h2><div class="privacy">Your exact address stays private until a rental is confirmed.</div><label><input id="terms" type="checkbox" style="width:auto"> I agree to the Rental Terms & Safety Agreement.</label>';main.innerHTML='<div class="wrap"><div class="panel">'+b+'<div class="actions">'+(step>1?'<button class="btn secondary" id="back">Back</button>':'')+'<button class="btn primary" id="next">'+(step===6?'Create Profile':'Continue')+'</button></div></div></div>';document.querySelectorAll('[data-role]').forEach(x=>x.onclick=()=>{onboardData.role=x.dataset.role;document.querySelectorAll('[data-role]').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});if(document.getElementById('back'))document.getElementById('back').onclick=()=>onboard(step-1);document.getElementById('next').onclick=()=>{if(step===1){onboardData.name=document.getElementById('name').value.trim();if(!onboardData.name)return alert('Enter your name.')}if(step===2)onboardData.address=document.getElementById('address').value.trim();if(step===3){onboardData.phone=document.getElementById('phone').value.trim();onboardData.email=document.getElementById('email').value.trim()}if(step===4&&!onboardData.role)return alert('Choose how you will use the app.');if(step===5)onboardData.radius=+document.getElementById('radius').value;if(step===6){if(!document.getElementById('terms').checked)return alert('Please accept the agreement.');set('profile',onboardData);set('plan','free');nav.classList.remove('hidden');return show('home')}onboard(step+1)}}function show(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if(v==='home')home();if(v==='need')needView();if(v==='list')listView();if(v==='rentals')rentalsView();if(v==='profile')profileView();scrollTo(0,0)}function home(){let p=profile(),f=favorites(),items=allListings().filter(x=>x.d<=browse.dist&&(!browse.q||x.n.toLowerCase().includes(browse.q.toLowerCase())||x.c.toLowerCase().includes(browse.q.toLowerCase()))&&(!browse.favoritesOnly||f.includes(x.id)));main.innerHTML='<div class="wrap"><div class="panel"><h2>Browse nearby equipment</h2><div class="muted">Hi '+esc(p.name)+'. Find what you need close to home.</div><div class="view-switch"><button class="list-on">☰ List View</button><a class="map-go" href="map.html">🗺️ Map View</a></div><button class="btn gold full" id="safetyHome">🛡️ Safety & How It Works</button><div class="searchbox" style="margin-top:12px"><input id="search" placeholder="Search equipment..." value="'+esc(browse.q)+'"><button class="btn primary" id="searchBtn">Search</button></div><label>Distance</label><div class="filters">'+[5,10,25,50].map(d=>'<button class="filter '+(browse.dist===d?'active':'')+'" data-dist="'+d+'">'+d+' mi</button>').join('')+'<button class="filter '+(browse.favoritesOnly?'active':'')+'" id="favFilter">♥ Favorites</button></div></div>'+items.map(x=>'<div class="card"><div class="picwrap"><div class="pic">'+x.e+'</div><button class="fav" data-fav="'+x.id+'">'+(f.includes(x.id)?'♥':'♡')+'</button></div><div class="body"><div class="row"><div><div class="listing-title">'+esc(x.n)+'</div><div class="meta">'+(x.mine?'Your listing':x.d+' miles away')+' • '+esc(x.c)+'</div></div><div class="price">$'+x.p+'/day</div></div><div style="margin-top:8px">⭐ 4.9 <span class="availability">'+esc(x.a)+'</span></div><div class="actions"><button class="btn secondary" data-detail="'+x.id+'">View Details</button>'+(x.mine?'<button class="btn primary" data-edit="'+x.id+'">Edit</button>':'<button class="btn primary" data-rent="'+x.id+'">Request Rental</button>')+'</div></div></div>').join('')+'</div>';document.getElementById('searchBtn').onclick=()=>{browse.q=document.getElementById('search').value.trim();home()};document.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>{browse.dist=+b.dataset.dist;home()});document.getElementById('favFilter').onclick=()=>{browse.favoritesOnly=!browse.favoritesOnly;home()};document.getElementById('safetyHome').onclick=safetyCenter;document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let f=favorites();f=f.includes(b.dataset.fav)?f.filter(x=>x!==b.dataset.fav):[...f,b.dataset.fav];set('favorites',f);home()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-rent]').forEach(b=>b.onclick=()=>requestRental(b.dataset.rent));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editListing(b.dataset.edit))}function detail(id){let x=allListings().find(y=>y.id===id);if(!x)return;main.innerHTML='<div class="wrap"><button class="back" id="back">‹ Back</button><div class="detailpic">'+x.e+'</div><div class="detail-title">'+esc(x.n)+'</div><div class="muted">'+esc(x.c)+' • '+(x.mine?'Your listing':x.d+' miles away')+'</div><div class="detail-grid"><div class="stat"><b>$'+x.p+'</b>per day</div><div class="stat"><b>$'+x.w+'</b>per week</div><div class="stat"><b>'+esc(x.a)+'</b>availability</div><div class="stat"><b>'+esc(x.owner)+'</b>owner</div></div><div class="privacy"><b>Address privacy:</b> Exact pickup addresses stay hidden until the rental is confirmed.</div><div class="safety"><b>Meet Safe:</b> Meet in daylight when possible, inspect and photograph the equipment, and do not proceed if anything feels wrong.</div><button class="btn gold full" id="safe" style="margin-top:10px">Full Safety Guide</button>'+(x.mine?'<button class="btn primary full" id="edit" style="margin-top:8px">Edit Listing</button>':'<button class="btn primary full" id="rent" style="margin-top:8px">Request Rental</button>')+'</div>';document.getElementById('back').onclick=home;document.getElementById('safe').onclick=safetyCenter;if(x.mine)document.getElementById('edit').onclick=()=>editListing(id);else document.getElementById('rent').onclick=()=>requestRental(id)}function requestRental(id){let x=allListings().find(y=>y.id===id);main.innerHTML='<div class="wrap"><button class="back" id="back">‹ Back</button><div class="panel"><h2>Request '+esc(x.n)+'</h2><label>Start date</label><input id="start" type="date"><label>Days</label><select id="days"><option>1</option><option>2</option><option>3</option><option>7</option></select><label>Message</label><textarea id="msg"></textarea><div class="privacy"><b>Payment:</b> Payment is handled directly between renter and owner. Agree on price, deposit, payment method, and timing before pickup.</div><div class="safety"><b>Meet Safe:</b> Verify the person and equipment, inspect it together, and take condition photos.</div><button class="btn primary full" id="send" style="margin-top:12px">Send Rental Request</button></div></div>';document.getElementById('back').onclick=()=>detail(id);document.getElementById('send').onclick=()=>{if(!document.getElementById('start').value)return alert('Choose a start date.');let a=rentals();a.unshift({id:'r'+Date.now(),name:x.n,start:document.getElementById('start').value,days:+document.getElementById('days').value,owner:x.owner,status:'Pending owner approval'});set('rentals',a);show('rentals')}}function needView(){let a=needs();main.innerHTML='<div class="wrap"><div class="panel"><h2>I Need This</h2><label>What do you need?</label><input id="item"><label>Budget per day</label><input id="budget" type="number"><button class="btn primary full" id="post" style="margin-top:12px">Post Request</button></div><div class="panel" style="margin-top:12px">'+(a.length?a.map((x,i)=>'<div class="item"><b>'+esc(x.item)+'</b><div class="muted">Budget $'+x.budget+'/day</div><button class="btn danger" data-del="'+i+'" style="margin-top:8px">Remove</button></div>').join(''):'<div class="empty">No active requests.</div>')+'</div></div>';document.getElementById('post').onclick=()=>{let v=document.getElementById('item').value.trim();if(!v)return;let a=needs();a.unshift({item:v,budget:+document.getElementById('budget').value||0});set('needs',a);needView()};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let a=needs();a.splice(+b.dataset.del,1);set('needs',a);needView()})}function listView(){let a=listings(),isPlus=plan()==='plus';main.innerHTML='<div class="wrap"><div class="panel"><div class="row"><div><h2>Your Equipment</h2><span class="badge '+(isPlus?'plusbadge':'')+'">'+(isPlus?'Beau Dog Plus':'Free Plan')+'</span></div><div class="muted">'+a.length+'/'+(isPlus?'∞':'2')+' listings</div></div><button class="btn primary full" id="add" style="margin-top:12px">+ Add Equipment</button>'+(!isPlus?'<button class="btn gold full" id="upgrade" style="margin-top:8px">⭐ Upgrade to Plus</button>':'')+'<div class="safety"><b>Protect Your Property:</b> Keep exact pickup addresses private until a rental is approved.</div></div><div class="panel" style="margin-top:12px">'+(a.length?a.map((x,i)=>'<div class="mylisting"><div class="row"><b>'+esc(x.name)+'</b><span class="price">$'+(+x.price||0)+'/day</span></div><div class="actions"><button class="btn secondary" data-view="m'+i+'">View</button><button class="btn secondary" data-edit="m'+i+'">Edit</button><button class="btn danger" data-remove="'+i+'">Remove</button></div></div>').join(''):'<div class="empty">No equipment listed yet.</div>')+'</div></div>';document.getElementById('add').onclick=()=>{if(plan()==='free'&&listings().length>=2)return pricingView(true);listingForm()};if(document.getElementById('upgrade'))document.getElementById('upgrade').onclick=()=>pricingView(false);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>detail(b.dataset.view));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editListing(b.dataset.edit));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let a=listings();a.splice(+b.dataset.remove,1);set('listings',a);listView()})}function listingForm(index=null){let a=listings(),x=index===null?{}:a[index]||{};main.innerHTML='<div class="wrap"><button class="back" id="back">‹ Back</button><div class="panel"><h2>'+(index===null?'List Equipment':'Edit Listing')+'</h2><label>Equipment name</label><input id="name" value="'+esc(x.name||'')+'"><label>Category</label><select id="cat"><option>Tools</option><option>Lawn & Garden</option><option>Farm</option><option>Trailers</option><option>Construction</option><option>Automotive</option><option>Snow Equipment</option><option>Camping</option><option>Party/Event</option></select><label>Daily price</label><input id="price" type="number" value="'+(x.price||'')+'"><label>Weekly price</label><input id="weekly" type="number" value="'+(x.weekly||'')+'"><label>Availability</label><input id="avail" value="'+esc(x.availability||'Available')+'"><label>Description</label><textarea id="desc">'+esc(x.description||'')+'</textarea><button class="btn primary full" id="save" style="margin-top:12px">Save Listing</button></div></div>';document.getElementById('back').onclick=listView;document.getElementById('save').onclick=()=>{let n=document.getElementById('name').value.trim();if(!n)return alert('Enter equipment name.');let obj={...x,name:n,category:document.getElementById('cat').value,price:+document.getElementById('price').value||0,weekly:+document.getElementById('weekly').value||0,availability:document.getElementById('avail').value.trim()||'Available',description:document.getElementById('desc').value.trim()};let a=listings();if(index===null)a.unshift(obj);else a[index]=obj;set('listings',a);listView()}}function editListing(id){listingForm(+id.slice(1))}function rentalsView(){let a=rentals();main.innerHTML='<div class="wrap"><div class="panel"><h2>My Rentals</h2><div class="privacy"><b>Payment:</b> Beau Dog does not process rental payments. Renter and owner arrange payment directly.</div>'+(a.length?a.map((x,i)=>'<div class="item"><div class="row"><b>'+esc(x.name)+'</b><span class="badge">'+esc(x.status)+'</span></div><div class="muted">Starts '+esc(x.start)+' • '+x.days+' day(s) • Owner: '+esc(x.owner)+'</div><div class="safety">Meet in daylight when possible, inspect equipment, and take before/after photos.</div><button class="btn danger" data-cancel="'+i+'" style="margin-top:8px">Cancel</button></div>').join(''):'<div class="empty">No rental requests yet.</div>')+'</div></div>';document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{let a=rentals();a.splice(+b.dataset.cancel,1);set('rentals',a);rentalsView()})}function pricingView(limitHit=false){main.innerHTML='<div class="wrap"><button class="back" id="back">‹ Back</button><div class="panel"><h2>'+ (limitHit?'You’ve reached the free listing limit':'Plans & Pricing') +'</h2><div class="muted">Renters can browse and request rentals for free. Owners can start free and upgrade when they need more room.</div><div class="plan"><h3>Free</h3><div class="planprice">$0</div><ul><li>Browse nearby equipment</li><li>Request rentals</li><li>Map View</li><li>Favorites & safety tools</li><li>List up to 2 items</li></ul></div><div class="plan plus"><span class="badge plusbadge">BEST FOR OWNERS</span><h3 style="margin-top:10px">Beau Dog Plus</h3><div class="planprice">$4.99<span style="font-size:13px">/month</span></div><div class="muted">or $39.99/year</div><ul><li>Unlimited equipment listings</li><li>Full owner/renter toolkit</li><li>Map visibility</li><li>Rental tracking & safety tools</li><li>Future calendar, verification and handoff features</li></ul><button class="btn primary full" id="monthly">Choose $4.99/month</button><button class="btn gold full" id="yearly" style="margin-top:8px">Choose $39.99/year</button></div><div class="privacy"><b>Rental payments:</b> Owners and renters arrange payment directly. Beau Dog does not take a percentage of each rental.</div><div class="muted" style="margin-top:10px">Prototype note: subscription buttons currently enable Plus locally for testing. Real App Store/web billing will be connected before launch.</div></div></div>';document.getElementById('back').onclick=listView;document.getElementById('monthly').onclick=()=>{set('plan','plus');set('billingChoice','monthly');alert('Beau Dog Plus enabled for prototype testing.');listView()};document.getElementById('yearly').onclick=()=>{set('plan','plus');set('billingChoice','yearly');alert('Beau Dog Plus enabled for prototype testing.');listView()}}function safetyCenter(){let steps=[['1','Browse or post a need'],['2','Review price, availability and owner information'],['3','Send a rental request'],['4','Wait for approval before sharing exact pickup details'],['5','Inspect and photograph equipment together'],['6','Confirm accessories, fuel and existing damage'],['7','Return on time and in agreed condition'],['8','Complete the rental and review the experience']];main.innerHTML='<div class="wrap"><button class="back" id="back">‹ Back</button><div class="panel"><h2>🛡️ Safety & How It Works</h2>'+steps.map(x=>'<div class="step"><div class="stepnum">'+x[0]+'</div><div>'+x[1]+'</div></div>').join('')+'<h3>Staying Safe When Meeting</h3><ul class="safety-list"><li>Meet in daylight whenever possible.</li><li>Use a public or well-visible location when practical.</li><li>Tell someone where you are going for home/property pickups.</li><li>Keep communication in the app.</li><li>Do not reveal an exact home address until the rental is confirmed.</li><li>Check ratings and verified status.</li><li>Cancel if something feels suspicious or unsafe.</li><li>Photograph equipment before pickup and after return.</li><li>Verify accessories, fuel level, serial numbers and visible damage.</li><li>Use appropriate PPE and never operate equipment while impaired.</li></ul><div class="safety"><b>Meet Safe:</b> Confirm the person and equipment match the listing and do not proceed if anything feels wrong.</div><div class="privacy"><b>Protect Your Property:</b> Keep handoffs outdoors when possible and remove valuables from view.</div><button class="btn danger full" id="report" style="margin-top:10px">Report a Problem</button></div></div>';document.getElementById('back').onclick=home;document.getElementById('report').onclick=reportView}function reportView(){main.innerHTML='<div class="wrap"><button class="back" id="back">‹ Back</button><div class="panel"><h2>Report a Problem</h2><label>Problem type</label><select id="type"><option>Report User</option><option>Unsafe Equipment</option><option>Damage or Dispute</option><option>Suspected Scam</option><option>Other</option></select><label>What happened?</label><textarea id="desc"></textarea><div class="safety"><b>Immediate danger:</b> Leave the area and contact local emergency services.</div><button class="btn primary full" id="save" style="margin-top:10px">Save Report</button></div></div>';document.getElementById('back').onclick=safetyCenter;document.getElementById('save').onclick=()=>{let d=document.getElementById('desc').value.trim();if(!d)return alert('Describe what happened.');let a=get('reports',[]);a.unshift({type:document.getElementById('type').value,description:d,date:new Date().toISOString()});set('reports',a);alert('Report saved on this device.');profileView()}}function profileView(){let p=profile(),isPlus=plan()==='plus';main.innerHTML='<div class="wrap"><div class="panel"><div class="profile-head"><div class="avatar">👤</div><h2>'+esc(p.name)+'</h2><span class="badge '+(isPlus?'plusbadge':'')+'">'+(isPlus?'Beau Dog Plus':'Free Plan')+'</span></div><div class="profile-stats"><div><b>'+listings().length+'</b>Listings</div><div><b>'+rentals().length+'</b>Rentals</div><div><b>'+favorites().length+'</b>Favorites</div></div><div class="item"><b>Address</b><div class="muted">'+esc(p.address||'Not entered')+'</div><span class="badge">Private until confirmed rental</span></div><div class="item"><b>Contact</b><div class="muted">'+esc(p.phone||'')+' • '+esc(p.email||'')+'</div></div><button class="btn '+(isPlus?'secondary':'gold')+' full" id="plans" style="margin-top:10px">'+(isPlus?'View Plan':'⭐ Upgrade to Beau Dog Plus')+'</button><button class="btn gold full" id="safety" style="margin-top:8px">🛡️ Safety & How It Works</button><button class="btn danger full" id="reset" style="margin-top:8px">Reset App Data</button></div></div>';document.getElementById('plans').onclick=()=>pricingView(false);document.getElementById('safety').onclick=safetyCenter;document.getElementById('reset').onclick=()=>{if(confirm('Erase local app data?')){localStorage.clear();location.reload()}}}nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.v));if(profile()){nav.classList.remove('hidden');show('home')}else onboard(1);</script></body></html>
